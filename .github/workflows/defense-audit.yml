name: Defensive Engineering & AI Agent PR Audit
on:
  pull_request:
    paths:
      - 'languages-engineering/**'
      - 'library/**'
      - 'packages/quint-models/**'
      - 'packages/quint-modules-resolver/**'
      - '.github/workflows/defense-audit.yml'
  push:
    branches: [main]
    paths:
      - 'languages-engineering/ts/defense/**'
      - 'languages-engineering/c/defense/**'
      - 'languages-engineering/cpp/defense/**'
      - 'languages-engineering/rust/defense/**'
      - 'packages/quint-models/engineering/defense/**'
      - '.github/workflows/defense-audit.yml'

permissions:
  contents: read

jobs:
  defense-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: TypeScript contrast, 5-model MBT SUT refinement, and 24-case 5-language Agent AST benchmark
        run: |
          bun test \
            languages-engineering/ts/defense/boundary-contrast/contrast.test.ts \
            languages-engineering/ts/defense/boundary-contrast/mbt-replay.test.ts \
            languages-engineering/ts/defense/agent-audit/agent-benchmark.test.ts \
            languages-engineering/ts/defense/agent-audit/agent-defense-audit.test.ts
      - name: C, C++20, and Rust paired defensive-boundary contrast harnesses
        run: |
          mkdir -p /tmp/defense-ci
          cc -Wall -Wextra -Werror \
            languages-engineering/c/defense/silent-fallback-contrast/bad_defensive.c \
            languages-engineering/c/defense/silent-fallback-contrast/deterministic_boundary.c \
            languages-engineering/c/defense/silent-fallback-contrast/contrast_test.c \
            -o /tmp/defense-ci/c_contrast
          /tmp/defense-ci/c_contrast
          c++ -std=c++20 -Wall -Wextra -Werror \
            languages-engineering/cpp/defense/raii-fallback-contrast/contrast_test.cpp \
            -o /tmp/defense-ci/cpp_contrast
          /tmp/defense-ci/cpp_contrast
          rustc --test languages-engineering/rust/defense/ownership-boundary-contrast/contrast.rs \
            -o /tmp/defense-ci/rust_contrast
          /tmp/defense-ci/rust_contrast
      - name: PR diff AI Agent defensive-hallucination gate (TS/C/C++/Rust/Scheme)
        if: github.event_name == 'pull_request'
        run: |
          git diff -U0 "origin/${{ github.base_ref }}...HEAD" > /tmp/pr-defense.patch
          bun languages-engineering/ts/defense/agent-audit/agent-defense-audit.ts --diff-file /tmp/pr-defense.patch
