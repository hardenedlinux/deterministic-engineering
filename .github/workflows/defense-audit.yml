name: Defensive Engineering & AI Agent PR Audit
on:
  pull_request:
    paths:
      - 'languages-engineering/**'
      - 'library/**'
      - 'packages/quint-models/**'
      - 'packages/quint-modules-resolver/**'
      - 't/harness/**'
      - 'Justfile'
      - '.github/workflows/defense-audit.yml'
  push:
    branches: [main]
    paths:
      - 'languages-engineering/*/defense/**'
      - 'packages/quint-models/engineering/defense/**'
      - 't/harness/**'
      - 'Justfile'
      - '.github/workflows/defense-audit.yml'

permissions:
  contents: read

jobs:
  defense-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-just
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Auto-discovered defense verification gate (TS + C + C++20 + Rust)
        run: just check-defense --skip=cbmc,scheme
      - name: PR diff AI Agent defensive-hallucination gate (TS/C/C++/Rust/Scheme)
        if: github.event_name == 'pull_request'
        run: |
          git diff -U0 "origin/${{ github.base_ref }}...HEAD" > /tmp/pr-defense.patch
          just audit-agent-patch --exclude-negative-fixtures --diff-file /tmp/pr-defense.patch
