name: Cross-Language Stability & Search Fuzzing Audit
on:
  pull_request:
    paths:
      - 'languages-engineering/*/stability/**'
      - 'languages-engineering/go/**'
      - 'packages/quint-models/engineering/concurrency/**'
      - 'packages/quint-models/engineering/gc/**'
      - 't/harness/**'
      - 'Justfile'
      - '.github/workflows/stability-audit.yml'
  push:
    branches: [main]
    paths:
      - 'languages-engineering/*/stability/**'
      - 'languages-engineering/go/**'
      - 'packages/quint-models/engineering/concurrency/**'
      - 'packages/quint-models/engineering/gc/**'
      - 't/harness/**'
      - 'Justfile'
      - '.github/workflows/stability-audit.yml'

permissions:
  contents: read

jobs:
  stability-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-just
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: bun install --frozen-lockfile
      - name: Auto-discovered stability & search fuzzing gate (TS/MBT + C + C++20 + Rust + Go -race)
        run: just check-stability --skip=cbmc,lean,scheme
      - name: PR diff AI Agent software-aging gate (Go/Rust/TS/C/C++)
        if: github.event_name == 'pull_request'
        run: |
          git diff -U0 "origin/${{ github.base_ref }}...HEAD" > /tmp/pr-stability.patch
          just audit-agent-stability --diff-file /tmp/pr-stability.patch
