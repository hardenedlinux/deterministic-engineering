name: Publish Package Mirrors (git subtree)
on:
  push:
    tags:
      - 'render-v*'
      - 'quint-models-v*'
      - 'quint-modules-resolver-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package directory under packages/'
        required: true
        type: choice
        options:
          - render
          - quint-models
          - quint-modules-resolver
      tag:
        description: 'Release tag to push to the mirror (e.g. render-v1.0.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Resolve package prefix and mirror target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PKG: ${{ inputs.package }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pkg="$INPUT_PKG"
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
            case "$tag" in
              render-v*) pkg="render" ;;
              quint-models-v*) pkg="quint-models" ;;
              quint-modules-resolver-v*) pkg="quint-modules-resolver" ;;
              *) echo "Unsupported tag: $tag" >&2; exit 1 ;;
            esac
          fi
          prefix="packages/$pkg"
          test -f "$prefix/package.json" || { echo "Missing $prefix/package.json" >&2; exit 1; }
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mirror=hardenedlinux/deterministic-engineering-$pkg" >> "$GITHUB_OUTPUT"
      - name: Split subtree and verify standalone manifest
        id: split
        env:
          PREFIX: ${{ steps.target.outputs.prefix }}
        run: |
          split_sha=$(git subtree split --prefix="$PREFIX" HEAD)
          git cat-file -e "$split_sha:package.json"
          echo "sha=$split_sha" >> "$GITHUB_OUTPUT"
          echo "Split $PREFIX at DE commit $GITHUB_SHA -> $split_sha"
      - name: Push split commit and tag to read-only mirror
        env:
          MIRROR: ${{ steps.target.outputs.mirror }}
          SPLIT_SHA: ${{ steps.split.outputs.sha }}
          TAG: ${{ steps.target.outputs.tag }}
          PUSH_TOKEN: ${{ secrets.PACKAGE_MIRROR_PUSH_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "PACKAGE_MIRROR_PUSH_TOKEN is not configured; refusing to push" >&2
            exit 1
          fi
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${MIRROR}.git"
          git push "$remote" "${SPLIT_SHA}:refs/heads/main"
          git push "$remote" "${SPLIT_SHA}:refs/tags/${TAG}"
