name: Deterministic Engineering Quint Packages
on:
  pull_request:
    paths:
      - 'packages/quint-models/**'
      - 'packages/quint-modules-resolver/**'
      - 'package.json'
      - 'bun.lock'
      - 't/harness/**'
      - 'Justfile'
      - '.github/workflows/quint.yml'
  push:
    branches: [main]
    paths:
      - 'packages/quint-models/**'
      - 'packages/quint-modules-resolver/**'
      - 'package.json'
      - 'bun.lock'
      - 't/harness/**'
      - 'Justfile'
      - '.github/workflows/quint.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quint-resolver-and-fleet:
    name: Quint Resolver Tests & Full Run-Plan Fleet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-just
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Typecheck & portable resolver conformance tests (includes full fleet run-plan + zero-sidecar check)
        run: just check-quint --portable --only=typecheck,test

  quint-mbt-fleet:
    name: Quint Full-Fleet 100% MBT Coverage Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-just
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Full fleet 100% action-coverage MBT audit
        run: just check-quint --portable --only=mbt
