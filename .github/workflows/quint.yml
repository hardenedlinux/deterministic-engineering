name: Deterministic Engineering Quint Packages
on:
  pull_request:
    paths:
      - 'packages/quint-models/**'
      - 'packages/quint-modules-resolver/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/quint.yml'
  push:
    branches: [main]
    paths:
      - 'packages/quint-models/**'
      - 'packages/quint-modules-resolver/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/quint.yml'

permissions:
  contents: read

jobs:
  quint-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:quint
      - run: bun run fleet:quint
      - run: bun run mbt:quint
      - run: bun test ./packages/quint-modules-resolver/test/conformance.test.ts ./packages/quint-modules-resolver/test/compose.test.ts ./packages/quint-modules-resolver/test/itf.test.ts ./packages/quint-modules-resolver/test/mbt-fleet.test.ts
