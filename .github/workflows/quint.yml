name: Deterministic Engineering Quint Packages
on:
  pull_request:
    paths:
      - 'packages/quint-models/**'
      - 'packages/quint-modules-resolver/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/quint.yml'
  push:
    branches: [main]
    paths:
      - 'packages/quint-models/**'
      - 'packages/quint-modules-resolver/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/quint.yml'

permissions:
  contents: read

jobs:
  quint-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:quint
      - run: bun run test:quint
      - name: Verify packages/quint-models projection receipts
        run: |
          bun -e '
            import {createHash} from "node:crypto";
            import {readFileSync} from "node:fs";
            import {join} from "node:path";
            const dirs = [
              "threat/capabilities",
              "threat/authority-currentness",
              "threat/effect-handoff",
              "threat/effect-containment",
              "threat/state-rollback",
              "engineering/concurrency/backpressure-memory",
            ];
            for (const d of dirs) {
              const dir = join("packages/quint-models", d);
              const r = JSON.parse(readFileSync(join(dir, "receipt.json"), "utf8"));
              for (const [p, h] of Object.entries(r.sources)) {
                if (createHash("sha256").update(readFileSync(p)).digest("hex") !== h)
                  throw new Error("Stale source " + p + " in " + d);
              }
              for (const [p, h] of Object.entries(r.artifacts)) {
                if (createHash("sha256").update(readFileSync(join(dir, p))).digest("hex") !== h)
                  throw new Error("Stale artifact " + p + " in " + d);
              }
            }
          '
