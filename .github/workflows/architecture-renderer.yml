name: Architecture renderer
on:
  pull_request:
    paths:
      - 'packages/architecture-renderer/**'
      - 'examples/architecture-rendering/**'
      - 'docs/90-99-views/90-architecture-views/**'
      - '.github/workflows/architecture-renderer.yml'
  push:
    branches: [main]
    paths:
      - 'packages/architecture-renderer/**'
      - 'examples/architecture-rendering/**'
      - 'docs/90-99-views/90-architecture-views/**'
      - '.github/workflows/architecture-renderer.yml'
permissions:
  contents: read
jobs:
  renderer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
        working-directory: packages/architecture-renderer
      - run: bun run typecheck
        working-directory: packages/architecture-renderer
      - run: bun test
        working-directory: packages/architecture-renderer
      - run: bun install --frozen-lockfile
        working-directory: examples/architecture-rendering
      - run: bun run render && bun run cases && bun run focused
        working-directory: examples/architecture-rendering
