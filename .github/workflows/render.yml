name: Deterministic Engineering Render
on:
  pull_request:
    paths:
      - 'packages/render/**'
      - 'package.json'
      - 'bun.lock'
      - 'docs/90-99-views/90-architecture-views/**'
      - 't/harness/**'
      - 'Justfile'
      - '.github/workflows/render.yml'
  push:
    branches: [main]
    paths:
      - 'packages/render/**'
      - 'package.json'
      - 'bun.lock'
      - 'docs/90-99-views/90-architecture-views/**'
      - 't/harness/**'
      - 'Justfile'
      - '.github/workflows/render.yml'
permissions:
  contents: read
jobs:
  renderer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-just
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: ./packages/render/node_modules/.bin/playwright install --with-deps chromium
      - name: Unified render package gate (typecheck + tests + Playwright export + examples)
        run: just check-render
      - name: Consume the reviewed Git package through Bun (local subtree split)
        run: just check-render-consumer
