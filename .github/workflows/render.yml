name: Deterministic Engineering Render
on:
  pull_request:
    paths:
      - 'packages/render/**'
      - 'package.json'
      - 'bun.lock'
      - 'docs/90-99-views/90-architecture-views/**'
      - 't/harness/**'
      - 'Justfile'
      - '.github/actions/**'
      - '.github/workflows/render.yml'
  push:
    branches: [main]
    paths:
      - 'packages/render/**'
      - 'package.json'
      - 'bun.lock'
      - 'docs/90-99-views/90-architecture-views/**'
      - 't/harness/**'
      - 'Justfile'
      - '.github/actions/**'
      - '.github/workflows/render.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  renderer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pw_cache: ~/.cache/ms-playwright
          - os: macos-latest
            pw_cache: ~/Library/Caches/ms-playwright
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-just
      - uses: ./.github/actions/setup-bun-cached
      - name: Restore Layer-1 Playwright Chromium cache (OS + arch + lockfile)
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ matrix.pw_cache }}
          key: de-playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'packages/render/package.json') }}
      - name: Install Chromium binary only on cache miss (and OS deps on Linux)
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            ./packages/render/node_modules/.bin/playwright install --with-deps chromium
          elif [ "${{ runner.os }}" = "Linux" ]; then
            ./packages/render/node_modules/.bin/playwright install-deps chromium
          fi
      - name: Restore Layer-2 Render CAS cache (SM18)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .data/ci-cache/render-${{ matrix.os }}
          key: de-render-cas-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 't/harness/verify-framework.ts') }}-${{ github.sha }}
          restore-keys: |
            de-render-cas-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 't/harness/verify-framework.ts') }}-
      - name: Unified render package gate (typecheck + tests + Playwright export + examples)
        run: just check-render --cache=.data/ci-cache/render-${{ matrix.os }}
      - name: Consume the reviewed Git package through Bun (local subtree split)
        run: just check-render-consumer
