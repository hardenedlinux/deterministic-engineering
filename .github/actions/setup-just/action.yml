name: Setup Just
description: Ensure the `just` command runner is available on Linux or macOS runners without third-party unpinned actions.
runs:
  using: composite
  steps:
    - name: Install just if absent
      shell: bash
      run: |
        if command -v just >/dev/null 2>&1; then
          just --version
          exit 0
        fi
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq just
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          brew install just
        else
          echo "Unsupported OS for setup-just: $RUNNER_OS" >&2
          exit 1
        fi
        just --version
