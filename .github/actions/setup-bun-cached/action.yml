name: Setup Bun Cached
description: Install pinned Bun and restore Layer-1 immutable package cache keyed by OS, arch, and bun.lock.
inputs:
  bun-version:
    description: Pinned Bun version
    required: false
    default: '1.3.11'
  install:
    description: Run bun install --frozen-lockfile after restoring cache
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Setup Bun ${{ inputs.bun-version }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ inputs.bun-version }}
    - name: Restore Layer-1 Bun package cache (OS + arch + bun.lock)
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: de-bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          de-bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-
    - name: Install workspace dependencies from frozen lockfile
      if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
