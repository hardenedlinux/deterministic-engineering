<section class="section" data-panel="" data-question="boundaries" data-region="principles"><h2><span class="num" data-question-marker="">3</span>Which responsibilities stay independent?</h2><div class="principles">
<div class="principle"><span class="icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h20v18H5zM9 4h18v18M10 13h10M10 18h7"></path><path d="M5 26h8" stroke-width="3.5"></path><circle cx="24" cy="25" r="4" fill="currentColor" stroke="none"></circle></svg></span><h3>One definition owner</h3><p>Selection and use reference definitions<br>Contract bodies are not copied</p></div><div class="principle"><span class="icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h24M4 16h24M4 25h24" opacity=".45"></path><rect x="8" y="3" width="6" height="8" rx="1.5" fill="currentColor"></rect><rect x="19" y="12" width="6" height="8" rx="1.5"></rect><rect x="10" y="21" width="6" height="8" rx="1.5"></rect></svg></span><h3>Selection keeps its scope</h3><p>Retain parents and both policies<br>Bind actual published methods</p></div><div class="principle"><span class="icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7H5v19h16v-8M18 4h10v10M28 4L13 19M10 16v6h6"></path><circle cx="5" cy="7" r="2" fill="currentColor" stroke="none"></circle></svg></span><h3>Reuse existing admission</h3><p>POO / Core own admission<br>Keep normalized return values</p></div><div class="principle"><span class="icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="20" rx="2"></rect><path d="M9 9h6M9 14h6M9 19h3M18 20l5-5 6 6-5 5z"></path><path d="M22 23l-4 5" opacity=".5"></path></svg></span><h3>Keep review independent</h3><p>Candidates, evidence and authority<br>Retain each source association</p></div></div></section>
