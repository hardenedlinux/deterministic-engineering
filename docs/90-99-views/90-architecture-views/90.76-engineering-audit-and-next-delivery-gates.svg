		.d2-1170104994 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="YmFzZWxpbmU= inspected"><g class="shape" ><rect x="58" y="12" width="470" height="114" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="293" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="293" dy="0">INSPECTED / bounded current evidence</tspan><tspan x="293" dy="17.25">22 recorded results / 1,282 referenced files consistent</tspan><tspan x="293" dy="17.25">No fresh native execution, build or performance run</tspan><tspan x="293" dy="17.25">Current implementation differs from HEAD and staged index</tspan></text></g><g class="ZmluZGluZ3M= boundary"><g class="shape" ><rect x="41" y="196" width="504" height="130" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="293" y="234.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="293" dy="0">OPEN / source-backed findings</tspan><tspan x="293" dy="17">Unsupported model scope aliases a supported basis</tspan><tspan x="293" dy="17">Native Scenario source argument is not bound to supplied scopes</tspan><tspan x="293" dy="17">Consumed exports exceed publication Contract checks</tspan><tspan x="293" dy="17">Canonical hierarchy / project Aitia / evaluation remain open</tspan></text></g><g class="ZzA= plan"><g class="shape" ><rect x="12" y="396" width="562" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="293" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="293" dy="0">G0 / DESIGN FREEZE FIRST</tspan><tspan x="293" dy="17">Supported Profile/method domains and independent oracle expectations</tspan><tspan x="293" dy="17">One authoritative captured input / adequate POO Contracts</tspan><tspan x="293" dy="17">Canonical parent, specialization and retained obligations</tspan><tspan x="293" dy="17">Concrete acceptance controls before new case expansion</tspan></text></g><g class="ZzE= plan"><g class="shape" ><rect x="29" y="596" width="528" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="293" y="634.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="293" dy="0">G1 / ONE COHERENT OWNER SLICE</tspan><tspan x="293" dy="17">Direct backpressure Library migration; no aliases or new loader</tspan><tspan x="293" dy="17">Close scope/input/Contract findings with source and tests</tspan><tspan x="293" dy="17">Core selected/unselected canary + package build</tspan><tspan x="293" dy="17">Fresh bounded Rust/QNT/Lean -&gt; real ASCENT registration and reuse</tspan></text></g><g class="ZzI= plan"><g class="shape" ><rect x="20" y="796" width="545" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="292.5" y="834.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="292.5" dy="0">G2 / FIRST PROJECT AITIA CONSUMPTION</tspan><tspan x="292.5" dy="17">Native Scheme / one explicit local review criterion and policy</tspan><tspan x="292.5" dy="17">Actual artifact, independent content review and exact request receipts</tspan><tspan x="292.5" dy="17">Missing/stale/counter/expected-negative distinctions</tspan><tspan x="292.5" dy="17">Synthetic applicability stays synthetic; no compliance claim</tspan></text></g><g class="ZzM= plan"><g class="shape" ><rect x="48" y="996" width="489" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="292.5" y="1034.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="292.5" dy="0">G3 / SECOND MECHANISM</tspan><tspan x="292.5" dy="17">Bounded broadcast close/wake under canonical domain owner</tspan><tspan x="292.5" dy="17">Preserve parent obligations; actual Tokio source mapping</tspan><tspan x="292.5" dy="17">Independent Rust + minimal QNT + ASCENT change evidence</tspan><tspan x="292.5" dy="17">No whole-runtime progress or performance inference</tspan></text></g><g class="ZzQ= plan"><g class="shape" ><rect x="23" y="1196" width="540" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="293" y="1234.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="293" dy="0">G4 / BOUNDED EVALUATION</tspan><tspan x="293" dy="17">Explicit executed subset of existing 24 variant contracts</tspan><tspan x="293" dy="17">Independent oracle, positive/negative controls and retained failures</tspan><tspan x="293" dy="17">Matched resource / Agent / Review cost measurements where relevant</tspan><tspan x="293" dy="17">Publish coverage denominator and claim-specific limits</tspan></text></g><g class="bGltaXQ= boundary"><g class="shape" ><rect x="48" y="1396" width="489" height="130" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="292.5" y="1434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="292.5" dy="0">AUDIT BOUNDARY</tspan><tspan x="292.5" dy="17">Priority order is reviewable; findings are not marked closed</tspan><tspan x="292.5" dy="17">Preserve old receipts, dirty work and ignored raw logs</tspan><tspan x="292.5" dy="17">No implementation, runtime rerun or new framework this turn</tspan><tspan x="292.5" dy="17">Stop recursive case growth until first owner gates are qualified</tspan></text></g><g class="KGJhc2VsaW5lIC0mZ3Q7IGZp