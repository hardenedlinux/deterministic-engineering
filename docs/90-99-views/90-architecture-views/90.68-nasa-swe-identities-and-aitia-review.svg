</tspan><tspan x="212.5" dy="17">Johnny.Decimal 10.18 / 10.19: document locations</tspan><tspan x="212.5" dy="17">AR05 / AR06 / AR08: local scenarios</tspan><tspan x="212.5" dy="17">ALG-INV etc.: proposed local obligations</tspan><tspan x="212.5" dy="17">None is a replacement SWE identifier</tspan></text></g><g class="b3duZXI= existing"><g class="shape" ><rect x="433" y="396" width="453" height="98" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="659.5" y="434.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="659.5" dy="0">EXISTING Aitia NASA Profile / Standards provider</tspan><tspan x="659.5" dy="17.666667">Source lock / criterion Catalog / applicability and tailoring</tspan><tspan x="659.5" dy="17.666667">Project context and source digest must remain explicit</tspan></text></g><g class="cG9v design"><g class="shape" ><rect x="195" y="590" width="481" height="114" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="435.5" y="628.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="435.5" dy="0">PROPOSED project / Library composition</tspan><tspan x="435.5" dy="17.25">Preserve applicable parent requirements</tspan><tspan x="435.5" dy="17.25">Select local coding / explanation criteria and domain methods</tspan><tspan x="435.5" dy="17.25">Many-to-many SWE &lt;-&gt; local obligation &lt;-&gt; case mapping</tspan></text></g><g class="dmFsaWRhdGlvbg== design"><g class="shape" ><rect x="204" y="774" width="462" height="114" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="435" y="812.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="435" dy="0">Future actual method and independent review</tspan><tspan x="435" dy="17.25">Complete artifact inputs and method coverage</tspan><tspan x="435" dy="17.25">Criterion contribution uses existing Aitia request boundary</tspan><tspan x="435" dy="17.25">No plain JSON or confident prose creates checked evidence</tspan></text></g><g class="YXNjZW50 existing"><g class="shape" ><rect x="178" y="958" width="514" height="98" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="435" y="996.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="435" dy="0">EXISTING ASCENT relations and native exchange</tspan><tspan x="435" dy="17.666667">Support / counter / pending / t_use preserve scoped evidence</tspan><tspan x="435" dy="17.666667">Keep both polarities, original cut and complete method references</tspan></text></g><g class="YWl0aWE= existing"><g class="shape" ><rect x="108" y="1126" width="654" height="114" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="435" y="1164.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="435" dy="0">EXISTING Aitia assessment / lifecycle / authority owners</tspan><tspan x="435" dy="17.25">If applicable: current failure precedes all-criteria-present</tspan><tspan x="435" dy="17.25">Unknown context remains unknown; source revision mismatch is not current evidence</tspan><tspan x="435" dy="17.25">Local support does not authorize release or certify compliance</tspan></text></g><g class="KHN0YXR1cyAtJmd0OyBzdGFuZGFyZClbMF0="><marker id="mk-d2-3063166135-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 659.5 128 L 659.5 192" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3063166135-3488378134)" mask="url(#d2-3063166135)" /></g><g class="KHN0YW5kYXJkIC0mZ3Q7IG93bmVyKVswXQ=="><path d="M 659.5 312 L 659.5 392" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="str