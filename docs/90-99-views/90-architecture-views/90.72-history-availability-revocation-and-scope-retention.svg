		.d2-771738007 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="aW5wdXQ= design"><g class="shape" ><rect x="493" y="12" width="475" height="114" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="730.5" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="730.5" dy="0">DESIGN / existing Aitia native Scheme owners</tspan><tspan x="730.5" dy="17.25">Same standard Profile / exact scoped project and policy</tspan><tspan x="730.5" dy="17.25">Captured history, actual methods and independent decisions</tspan><tspan x="730.5" dy="17.25">New packets are authored inputs and gold only</tspan></text></g><g class="aGlzdG9yeQ== design"><g class="shape" ><rect x="12" y="206" width="476" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="250" y="244.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="250" dy="0">HC04 / unavailable history</tspan><tspan x="250" dy="17">Keep authenticated known failures and reusable results</tspan><tspan x="250" dy="17">Unknown coverage is neither empty nor a fabricated counter</tspan><tspan x="250" dy="17">Withhold p3/p4 until exact boundary is established</tspan><tspan x="250" dy="17">Archive authority / coverage / trust-policy controls: see 90.73</tspan></text></g><g class="cmV2b2NhdGlvbg== owner"><g class="shape" ><rect x="508" y="206" width="446" height="130" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="731" y="244.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="731" dy="0">CR06 / revocation and actual use</tspan><tspan x="731" dy="17">Old admission rechecks private receipt membership</tspan><tspan x="731" dy="17">Admission captures now; it does not advance the clock</tspan><tspan x="731" dy="17">Returned gate remains a historical value</tspan><tspan x="731" dy="17">Second genuine receipt may still admit the same request</tspan></text></g><g class="c2NvcGU= design"><g class="shape" ><rect x="974" y="206" width="492" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="1220" y="244.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1220" dy="0">BC06 / legitimate limited scope</tspan><tspan x="1220" dy="17">Actual governing change authority + complete retention matrix</tspan><tspan x="1220" dy="17">New scoped project starts its own lifecycle</tspan><tspan x="1220" dy="17">Limited review can pass while original work stays blocked</tspan><tspan x="1220" dy="17">Keep original proof/cost obligations; owner handoff: see 90.73</tspan></text></g><g class="cmV2aWV3 design"><g class="shape" ><rect x="494" y="416" width="473" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="730.5" y="454.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="730.5" dy="0">DESIGN / matching evidence and request closure</tspan><tspan x="730.5" dy="17">Exact history boundary / observed check-revoke-use order</tspan><tspan x="730.5" dy="17">Original obligations -&gt; approved change -&gt; limited review</tspan><tspan x="730.5" dy="17">T/V evidence may be reusable; A and requests remain scoped</tspan><tspan x="730.5" dy="17">Later full-scope follow-up references prior immutable inputs</tspan></text></g><g class="cmFjZQ== boundary"><g class="shape" ><rect x="476" y="616" width="509" height="130" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="730.5" y="654.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="730.5" dy="0">ACTUAL-USE BOUNDARY / qualification still required</tspan><tspan x="730.5" dy="17">Check -&gt; revoke -&gt; use needs actual effect/order review: see 90.73</tspan><tspan x="730.5" dy="17">Revoke -&gt; check refuses; use -&gt; revoke preserves historical facts</tspan><tspan x="730.5" dy="17">Unknown order stays unverified</tspan><tspan x="730.5" dy="17">Aitia stage is not action or release authority</tspan></text></g><g class="cmVzdWx0 boundary"><g class="shape" ><rect x="502" y="816" width="457" height="130" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="730.5" y="854.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="730.5" dy="0">DESIGN GOLD / scoped outcomes</tspan><tspan x="730.5" dy="17">Outage: content unverified, known evidence preserved</tspan><tspan x="730.5" dy="17">Revoked/expired receipt: fresh explicit-time re-evaluation</tspan><tspan x="730.5" dy="17">Limited scope: L admitted can coexist with W blocked</tspan><tspan x="730.5" dy="17">No new implementation, service or framework</tspan></text></g><g class="KGlucHV0IC0mZ3Q7IGhpc3RvcnkpWzBd"><marker id="mk-d2-771738007-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 612.25 128 L 612.25 156 S 612.25 166 602.25 166 L 260 166 S 250 166 250 176 L 250 202" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-771738007-3488378134)" mask="url(#d2-771738007)" /></g><g class="KGlucHV0IC0mZ3Q7IHJldm9jYXRpb24pWzBd"><path d="M 731 128 L 731 202" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-