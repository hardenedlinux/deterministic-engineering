og reasoning</tspan><tspan x="739" dy="18">Native support / counter / conditional / conflict</tspan><tspan x="739" dy="18">Domain rule contracts derive scoped obligations</tspan><tspan x="739" dy="18">Check policy requirements / method applicability</tspan><tspan x="739" dy="18">Domain lowering not implemented here</tspan></text></g><g class="cXVlcmllcw== gate"><g class="shape" ><rect x="507" y="713" width="463" height="135" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="738.5" y="752.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="738.5" dy="0">Concrete policy packet queries</tspan><tspan x="738.5" dy="18">OP: ownership true, required order unknown</tspan><tspan x="738.5" dy="18">BR: history retained, required record absent</tspan><tspan x="738.5" dy="18">AM: real method result, mapping unknown or forbidden</tspan><tspan x="738.5" dy="18">Pending use and refused offer are separate</tspan></text></g><g class="ZmVlZGJhY2s= input"><g class="shape" ><rect x="307" y="948" width="453" height="135" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="533.5" y="987.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="533.5" dy="0">Reasoning feedback to Agent</tspan><tspan x="533.5" dy="18">Which premise supports this candidate?</tspan><tspan x="533.5" dy="18">Which actual rule/policy requires missing evidence?</tspan><tspan x="533.5" dy="18">What counter or changed dependency affects this use?</tspan><tspan x="533.5" dy="18">Default explanation is not automatic per-row proof</tspan></text></g><g class="YWN0dWFs state"><g class="shape" ><rect x="286" y="239" width="413" height="118" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="492.5" y="278.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="492.5" dy="0">Actual later tool / checker / reviewer evidence</tspan><tspan x="492.5" dy="18.25">New captured inputs and exact reference closure</tspan><tspan x="492.5" dy="18.25">Re-evaluate affected current associations</tspan><tspan x="492.5" dy="18.25">Retain frozen input / gold / historical evidence</tspan></text></g><g class="KGFnZW50IC0mZ3Q7IGlucHV0cylbMF0="><marker id="mk-d2-1816326109-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 720.443198 114.066269 C 931.700012 165.518005 985 190.699997 985 235.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1816326109-3488378134)" mask="url(#d2-1816326109)" /></g><g class="KGlucHV0cyAtJmd0OyBpbmZlcilbMF0="><path d="M 985 358.5 C 985 405.299988 962 429.700012 873.533656 476.625626" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1816326109-3488378134)" mask="url(#d2-1816326109)" /></g><g class="KGluZmVyIC0mZ3Q7IHF1ZXJpZXMpWzBd"><path d="M 738.75 615 C 738.75 653 738.75 673 738.75 709" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1816326109-3488378134)" mask="url(#d2-1816326109)" /></g><g class="KHF1ZXJpZXMgLSZndDsgZmVlZGJhY2spWzBd"><path d="M 738.75 850 C 738.75 888 721.150024 908 654.227827 946.023963" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1816326109-3488378134)" mask="url(#d2-1816326109)" /></g><g class="KGZlZWRiYWNrIC0mZ3Q7IGFnZW50KVswXQ=="><path d="M 318.594307 947.393096 C 194.899002 908 163.5 874.5 163.5 839.25 C 163.5 804 163.5 757 163.5 721.75 C 163.5 686.5 163.5 639.5 163.5 604.25 C 163.5 569 163.5 519.900024 163.5 481.5 C 163.5 443.100006 163.5 393.600006 163.5 357.75 C 163.5 321.899994 196.699997 166.300003 325.74547 118.879677" stroke=