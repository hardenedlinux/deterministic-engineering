h="453" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="436.5" y="380.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="436.5" dy="0">Original std/make + expander module registry</tspan><tspan x="436.5" dy="17.666667">Source contexts retain code and delayed evaluator</tspan><tspan x="436.5" dy="17.666667">Preparation -&gt; dependency completions -&gt; native compile</tspan></text></g><g class="cXVldWU="><g class="shape" ><rect x="225" y="510" width="424" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="437" y="548.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="437" dy="0">Original backend executor</tspan><tspan x="437" dy="17.666667">Path/settings jobs; diagnostic context is not a full AST</tspan><tspan x="437" dy="17.666667">Drain, join and reset; retain default link target</tspan></text></g><g class="YnVpbGQ="><g class="shape" ><rect x="208" y="686" width="457" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="436.5" y="724.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="436.5" dy="0">Pinned POO: 67.847s, 92 frontend / 238 jobs</tspan><tspan x="436.5" dy="17.666667">Current POO: 105.772s, 213 frontend / 521 jobs</tspan><tspan x="436.5" dy="17.666667">Both completed / 0; 12 observed machine-derived workers</tspan></text></g><g class="Y29uc3VtZXI="><g class="shape" ><rect x="230" y="862" width="414" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="437" y="900.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="437" dy="0">Independent native object + iterator consumer</tspan><tspan x="437" dy="17.666667">Actual missing macro phase -&gt; refuse; restore object</tspan><tspan x="437" dy="17.666667">Six Scheme cases + sixteen Python controls pass</tspan></text></g><g class="Y29ob3J0"><g class="shape" ><rect x="685" y="678" width="534" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="952" y="716.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="952" dy="0">Core native pin -&gt; POO c0d4763</tspan><tspan x="952" dy="17.25">Parser/ASCENT -&gt; Core e77698c</tspan><tspan x="952" dy="17.25">Engineering consumes repaired Aitia be98efb / native metadata 8 of 8</tspan><tspan x="952" dy="17.25">Coherent Core/POO migration has separate admission</tspan></text></g><g class="cmVjZWlwdA=="><g class="shape" ><rect x="466" y="1040" width="458" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="695" y="1078.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="695" dy="0">Local POO cold native builds qualified</tspan><tspan x="695" dy="18.5">Complete Aitia cold closure / new Linux CI remain separate</tspan></text></g><g class="KGNvbnRyYWN0IC0mZ3Q7IHF1ZXJ5KVswXQ=="><marker id="mk-d2-293521599-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 222.5 96 L 222.5 160" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-293521599-3488378134)" mask="url(#d2-293521599)" /></g><g class="KHF1ZXJ5IC0mZ3Q7IG1ha2UpWzBd"><path d="M 361.75 264 L 361.75 338" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-293521599-3488378134)" mask="url(#d2-293521599)" /></g><g class="KGlucHV0cyAtJmd0OyBtYWtlKVswXQ=="><path d="M 512.75 264 L 512.75 338" s