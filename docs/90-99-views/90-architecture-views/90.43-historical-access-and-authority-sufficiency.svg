aries</tspan><tspan x="214" dy="18.25">No original-unit confirmation of P3 / sigma3</tspan><tspan x="214" dy="18.25">Historical grant not current read permission</tspan><tspan x="214" dy="18.25">Current denied read refused; fresh use needs scope</tspan></text></g><g class="aGlzdG9yeQ== input"><g class="shape" ><rect x="648" y="227" width="450" height="118" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="873" y="266.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="873" dy="0">AH00 / AH01 independent authority case</tspan><tspan x="873" dy="18.25">Authentic original action and covered OC1</tspan><tspan x="873" dy="18.25">deny41 -&gt; dispatch -&gt; consume -&gt; complete -&gt; allow42</tspan><tspan x="873" dy="18.25">Causal order alone not complete authority coverage</tspan></text></g><g class="Y2xvc2Vk state"><g class="shape" ><rect x="560" y="474" width="474" height="135" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="797" y="513.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="797" dy="0">AH02 / AH03 actual H41 and Kauth</tspan><tspan x="797" dy="18">Complete relevant grants / exceptions / delegation</tspan><tspan x="797" dy="18">Entire consumption interval denied</tspan><tspan x="797" dy="18">Covered unauthorized occurrence established</tspan><tspan x="797" dy="18">No extra direct boundary receipt needed if policy accepts</tspan></text></g><g class="bGltaXRz gate"><g class="shape" ><rect x="566" y="709" width="461" height="135" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="796.5" y="748.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="796.5" dy="0">AH04 / AH05 retained checks</tspan><tspan x="796.5" dy="18">Coverage gap or straddled interval stays pending</tspan><tspan x="796.5" dy="18">Contract requiring direct receipt retains that obligation</tspan><tspan x="796.5" dy="18">Historical denial not authorization for retry</tspan><tspan x="796.5" dy="18">New subject / current use has its own guards</tspan></text></g><g class="KGRlbGl2ZXJ5IC0mZ3Q7IGFuc3dlcilbMF0="><marker id="mk-d2-381192987-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 290.25 120 C 290.25 158 290.25 178 290.25 214" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-381192987-3488378134)" mask="url(#d2-381192987)" /></g><g class="KGFuc3dlciAtJmd0OyBjdXJyZW50KVswXQ=="><path d="M 248.983493 354.222415 C 221.199997 401.299988 214 427.299988 214 478.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-381192987-3488378134)" mask="url(#d2-381192987)" /></g><g class="KGhpc3RvcnkgLSZndDsgY2xvc2VkKVswXQ=="><path d="M 873 347.5 C 873 399.899994 865.799988 425.700012 839.033014 471.05517" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-381192987-3488378134)" mask="url(#d2-381192987)" /></g><g class="KGNsb3NlZCAtJmd0OyBsaW1pdHMpWzBd"><path d="M 796.75 611 C 796.75 649 796.75 669 796.75 705" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-381192987-3488378134)" mask="url(#d2-381192987)" /></g><g class="KGFuc3dlciAtJmd0OyBjbG9zZWQpWzBd"><path d="M 426.535889 353.400333 C 521.549011 401.299988 569.349976 425.700012 660.196705 472.663128" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-381192987-3488378134)" mask="url(#d2-381192987)" /><text x="544.5" y="419" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">scoped sufficiency; independent co