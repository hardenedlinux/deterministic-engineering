		.d2-377685552 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="c2VsZWN0aW9u owner"><g class="shape" ><rect x="438" y="12" width="395" height="114" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="635.5" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="635.5" dy="0">EXISTING native Scheme owners</tspan><tspan x="635.5" dy="17.25">NasaSdlcModule / nasa-sdlc-npr7150_2</tspan><tspan x="635.5" dy="17.25">Project + class/context + focused stage policy</tspan><tspan x="635.5" dy="17.25">Domain Library Profile / concrete review Scenario</tspan></text></g><g class="cGFja2V0cw== design"><g class="shape" ><rect x="465" y="196" width="341" height="114" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="635.5" y="234.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="635.5" dy="0">DESIGN input bundles / independent gold</tspan><tspan x="635.5" dy="17.25">061/p1, 080/p1, 081/p1, 088/p1-p5</tspan><tspan x="635.5" dy="17.25">Eight paragraph bindings for each AR case</tspan><tspan x="635.5" dy="17.25">No new framework or installed adapter</tspan></text></g><g class="YXIwNQ== design"><g class="shape" ><rect x="12" y="390" width="409" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="216.5" y="428.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="216.5" dy="0">AR05 / participant boundary</tspan><tspan x="216.5" dy="17">One immutable checker result can serve two views</tspan><tspan x="216.5" dy="17">Two views do not mean two independent reviewers</tspan><tspan x="216.5" dy="17">Local policy + roster + attestations decide p5</tspan><tspan x="216.5" dy="17">Open participant defect also blocks completion</tspan></text></g><g class="YXIwNg== design"><g class="shape" ><rect x="441" y="390" width="389" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="635.5" y="428.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="635.5" dy="0">AR06 / source boundary</tspan><tspan x="635.5" dy="17">B -&gt; C plain-comment change</tspan><tspan x="635.5" dy="17">Wording may survive; source bytes differ</tspan><tspan x="635.5" dy="17">080 change ledger / 081 controlled-item versions</tspan><tspan x="635.5" dy="17">Old native result is not C correspondence</tspan></text></g><g class="YXIwOA== design"><g class="shape" ><rect x="850" y="390" width="375" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="1037.5" y="428.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1037.5" dy="0">AR08 / opposing-evidence boundary</tspan><tspan x="1037.5" dy="17">Wake-only sample cannot cover all callbacks</tspan><tspan x="1037.5" dy="17">Counter and pending may coexist</tspan><tspan x="1037.5" dy="17">p4 tracking may pass while p3 completion fails</tspan><tspan x="1037.5" dy="17">Current matching fail is not erased by pass</tspan></text></g><g class="Y2xvc3VyZQ== owner"><g class="shape" ><rect x="425" y="600" width="421" height="130" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="635.5" y="638.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="635.5" dy="0">EXISTING criterion / verification owners</tspan><tspan x="635.5" dy="17">Captured bytes + selected policy + actual review</tspan><tspan x="635.5" dy="17">-&gt; artifact digest / paragraph locator / record</tspan><tspan x="635.5" dy="17">-&gt; exact request / genuine receipt</tspan><tspan x="635.5" dy="17">NASA chapter digest differs from Rust source identity</tspan></text></g><g class="YXNzZXNzbWVudA== boundary"><g class="shape" ><rect x="429" y="800" width="413" height="130" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="635.5" y="838.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="635.5" dy="0">Assessment and stage have different precedence</tspan><tspan x="635.5" dy="17">Applicable assessment: fail before evidence-present</tspan><tspan x="635.5" dy="17">Assessment applicability precedes failure</tspan><tspan x="635.5" dy="17">Stage keeps all selected current fail records</tspan><tspan x="635.5" dy="17">Context/scope status never removes failure list</tspan></text></g><g class="cmVzdWx0 owner"><g class="shape" ><rect x="404" y="1000" width="463" height="146" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="635.5" y="1038.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="635.5" dy="0">Existing nasa-stage-gate / saved result</tspan><tspan x="635.5" dy="16.833333">Focused admission requires verified content</tspan><tspan x="635.5" dy="16.833333">Retain complete opposing closure and old history</tspan><tspan x="635.5" dy="16.833333">New revision: independently verify inherited action closure</tspan><tspan x="635.5" dy="16.833333">Rebind affected review; reuse stable evidence</tspan><tspan x="635.5" dy="16.833333">No release authority or NASA compliance inferred</tspan></text></g><g class="cXVhbGlmaWNhdGlvbg== boundary"><g class="shape" ><rect x="411" y="1216" width="448" height="114" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="635" y="1254.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="635" dy="0">QUALIFICATION BOUNDARY</tspan><tspan x="635" dy="17.25">Existing native review + lifecycle tests passed</tspan><tspan x="635" dy="17.25">AR packet steps are authored gold, not executed receipts</tspan><tspan x="635" dy="17.25">No production verifier or new Scenario installed</tspan></text></g><g class="KHNlbGVjdGlvbiAtJmd0OyBwYWNrZXRzKVswXQ=="><marker id="mk-d2-377685552-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 635.5 128 L 635.5 192" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-377685552-3488378134)" mask="url(#d2-377685552)" /></g><g class="KHBhY2tldHMgLSZndDsgYXIwNSlbMF0="><path d="M 550.25 312 L 550.25 340 S 550.25 350 540.25 350 L 226.5 350 S 216.5 350 216.5 360 L 216.5 386" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-377685552-3488378134)" mask="url(#d2-377685552)" /></g><g class="KHBhY2tldHMgLSZndDsgYXIwNilbMF0="><path d="M 635.5 312 L 635.5 386" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-377685552-3488378134)" mask="url(#d2-377685552)" /></g><g class="KHBhY2tldHMgLSZndDsgYXIwOClbMF0="><path d="M 720.75 312 L 720.75 340 S 720.75 350 730.75 350 L 1027.5 350 S 1037.5 350 1037.5 360 L 1037.5 386" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-377685552-3488378134)" mask="url(#d2-377685552)" /></g><g class="KGFyMDUgLSZndDsgY2xvc3VyZSlbMF0="><path d="M 216.5 522 L 216.5 550 S 216.5 560 226.5 560 L 520.25 560 S 530.25 560 530.25 570 L 530.25 596" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-377685552-3488378134)" mask="url(#d2-