><tspan x="711" dy="0">Agent candidates + ASCENT relation reasoning</tspan><tspan x="711" dy="18">Native clue / attested / factor / link / question</tspan><tspan x="711" dy="18">Domain BP-R01-R09: holders / lifecycle / dependencies</tspan><tspan x="711" dy="18">Cqueue support does not imply Cmemory support</tspan><tspan x="711" dy="18">Cross-claim counter is not native conflict</tspan></text></g><g class="b2JsaWdhdGlvbnM= gate"><g class="shape" ><rect x="484" y="709" width="454" height="135" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="711" y="748.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="711" dy="0">BP-O01-O08 verification obligations</tspan><tspan x="711" dy="18">Inventory / safety / arithmetic / correspondence</tspan><tspan x="711" dy="18">Cleanup / liveness / memory / performance / argument</tspan><tspan x="711" dy="18">Actual holder and resident-byte bounds required</tspan><tspan x="711" dy="18">Queue-only waiting producers can defeat full bound</tspan></text></g><g class="bW9kZWxz input"><g class="shape" ><rect x="738" y="953" width="442" height="118" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="959" y="992.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="959" dy="0">Actual later QNT / Lean inputs and outcomes</tspan><tspan x="959" dy="18.25">Model states / assumptions / conditional sum</tspan><tspan x="959" dy="18.25">Independent transition / arithmetic oracle</tspan><tspan x="959" dy="18.25">No automatic source correspondence or native proof</tspan></text></g><g class="cnVucw== input"><g class="shape" ><rect x="246" y="944" width="432" height="135" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="462" y="983.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="462" dy="0">Actual later native memory / performance evidence