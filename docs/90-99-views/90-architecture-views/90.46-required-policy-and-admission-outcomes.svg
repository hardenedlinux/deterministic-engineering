R actual direct-record requirement</tspan><tspan x="674" dy="18">H41 history retained; record missing: pending</tspan><tspan x="674" dy="18">Explicitly forbidden substitution: offer refused</tspan><tspan x="674" dy="18">Matching genuine record may qualify exact scope</tspan><tspan x="674" dy="18">Missing record is not a new actual violation</tspan></text></g><g class="bWV0aG9k gate"><g class="shape" ><rect x="0" y="218" width="407" height="135" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="203.5" y="257.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="203.5" dy="0">AM genuine VAlt / exact method scope</tspan><tspan x="203.5" dy="18">Unknown mapping: pending, not forbidden</tspan><tspan x="203.5" dy="18">Actual closed forbidden mapping: RJ06 for offer</tspan><tspan x="203.5" dy="18">Actual allowed mapping: scoped review support</tspan><tspan x="203.5" dy="18">Completed result retained in original scope</tspan></text></g><g class="cmV1c2U= state"><g class="shape" ><rect x="454" y="453" width="440" height="135" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="674" y="492.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="674" dy="0">Current use versus reusable evidence</tspan><tspan x="674" dy="18">Fresh method / policy / source / issuer guards</tspan><tspan x="674" dy="18">New counter and full intake still required</tspan><tspan x="674" dy="18">No automatic A / positive Q / effect authority</tspan><tspan x="674" dy="18">DE01 avoids duplicate checks without waiving policy</tspan></text></g><g class="KHBvbGljeSAtJmd0OyBvcmRlcilbMF0="><marker id="mk-d2-1722068940-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 912.449057 113.44