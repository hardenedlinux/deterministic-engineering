		.d2-2096012956 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="aW5wdXQ= design"><g class="shape" ><rect x="460" y="12" width="454" height="114" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="687" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="687" dy="0">DESIGN / same native Aitia and domain owners</tspan><tspan x="687" dy="17.25">Captured archive, event trace or responsibility record</tspan><tspan x="687" dy="17.25">Explicit governing policy and independent method review</tspan><tspan x="687" dy="17.25">New input/gold cases; no new runtime framework</tspan></text></g><g class="YXJjaGl2ZQ== design"><g class="shape" ><rect x="12" y="214" width="430" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="227" y="252.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="227" dy="0">HA04 / archive applicability</tspan><tspan x="227" dy="17">Authentic original bytes + actual authority scope</tspan><tspan x="227" dy="17">Exact owners / predecessor closure / historical cut</tspan><tspan x="227" dy="17">Unavailable current status remains pending: see 90.74</tspan><tspan x="227" dy="17">Old serialized receipt is not new issuer authority</tspan></text></g><g class="cmFjZQ== design"><g class="shape" ><rect x="462" y="206" width="451" height="146" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="687.5" y="244.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="687.5" dy="0">RV02 / check -&gt; revoke -&gt; actual use</tspan><tspan x="687.5" dy="16.833333">Saved check covers its original cut only</tspan><tspan x="687.5" dy="16.833333">Record the real effect and causal-order evidence</tspan><tspan x="687.5" dy="16.833333">After-check revocation can invalidate later reliance</tspan><tspan x="687.5" dy="16.833333">Repeated checks before another gap prove no atomicity</tspan><tspan x="687.5" dy="16.833333">Past now cannot recover unknown event order: see 90.74</tspan></text></g><g class="aGFuZG9mZg== design"><g class="shape" ><rect x="933" y="214" width="465" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="1165.5" y="252.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1165.5" dy="0">LS07 / unavailable original owner</tspan><tspan x="1165.5" dy="17">Keep last authorized assignment and open obligation</tspan><tspan x="1165.5" dy="17">Apply actual reassignment / fallback policy</tspan><tspan x="1165.5" dy="17">Require acceptance only when governing policy demands it</tspan><tspan x="1165.5" dy="17">No authorized fallback means missing approval: see 90.74</tspan></text></g><g class="cmV2aWV3 design"><g class="shape" ><rect x="429" y="432" width="517" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="687.5" y="470.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="687.5" dy="0">DESIGN / independent applicability and authority oracle</tspan><tspan x="687.5" dy="17">Archive coverage table / actual request and effect order</tspan><tspan x="687.5" dy="17">Original obligation -&gt; authorized assignment -&gt; effective boundary</tspan><tspan x="687.5" dy="17">Complete T/V lineage, scoped A and captured paragraph locators</tspan><tspan x="687.5" dy="17">Unknown coverage, order or authority stays explicitly pending</tspan></text></g><g class="bmF0aXZl owner"><g class="shape" ><rect x="435" y="632" width="505" height="130" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="687.5" y="670.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="687.5" dy="0">EXISTING native request / receipt boundary</tspan><tspan x="687.5" dy="17">Verify actual bundle through current trusted adapter</tspan><tspan x="687.5" dy="17">New request bindings and genuine receipts for current review</tspan><tspan x="687.5" dy="17">Current registered fail blocks the selected requirement</tspan><tspan x="687.5" dy="17">Presence, saved gate and digest alone supply no action authority</tspan></text></g><g class="cmVzdWx0 boundary"><g class="shape" ><rect x="433" y="832" width="509" height="130" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="687.5" y="870.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="687.5" dy="0">DESIGN GOLD / not executed</tspan><tspan x="687.5" dy="17">Keep authentic fragments, actual effects and old failures</tspan><tspan x="687.5" dy="17">Re-review only affected evidence and required actions</tspan><tspan x="687.5" dy="17">Limited review and owner transfer leave original proof work open</tspan><tspan x="687.5" dy="17">Source/owner concurrency and recovery tests still required</tspan></text></g><g class="KGlucHV0IC0mZ3Q7IGFyY2hpdmUpWzBd"><marker id="mk-d2-2096012956-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 574 128 L 574 156 S 574 166 564 166 L 237 166 S 227 166 227 176 L 227 210" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2096012956-3488378134)" mask="url(#d2-2096012956)" /></g><g class=