.mast{padding:5px 12px 18px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:2px;color:var(--accent);margin-bottom:10px}.mast h1{font-size:42px;line-height:1.2;letter-spacing:-1.3px;font-weight:900}.mast h1 em{font-style:normal;color:var(--accent)}.dek{font-size:17px;color:var(--muted);margin-top:10px;line-height:1.6}.badge{float:right;border-radius:24px;background:var(--secondaryTint);color:var(--secondary);padding:8px 14px;font-size:13px;font-weight:750;letter-spacing:0}
.section{background:var(--surface);padding:17px 20px;border-radius:17px;margin-bottom:12px;border:1px solid color-mix(in srgb,var(--border) 60%,transparent)}.section h2,.half h2{font-size:23px;line-height:32px;display:flex;align-items:center;gap:12px;margin-bottom:14px;letter-spacing:-.3px}.num{border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;color:var(--onAccent);background:var(--accent);font-size:18px;flex:none}.sub{font-size:13px;color:var(--muted);font-weight:400;margin-left:auto}.lead{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.lead-item{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--tint);border-radius:10px}.lead-item:nth-child(2){background:var(--secondaryTint)}.lead-item:nth-child(3){background:color-mix(in srgb,var(--supported) 9%,var(--surface))}.lead-item .icon{width:36px;height:36px;color:var(--accent)}.lead-item:nth-child(2) .icon{color:var(--secondary)}.lead-item:nth-child(3) .icon{color:var(--supported)}.lead-item h3{font-size:20px;line-height:1.3;margin-bottom:5px}.lead-item p{font-size:15px;line-height:1.6;color:var(--muted)}
.architecture{display:grid;grid-template-columns:310px 44px 1fr;align-items:stretch;position:relative}.domain{border:1px solid var(--border);border-radius:12px;padding:14px}.domain.published{background:var(--tint);border-color:color-mix(in srgb,var(--accent) 26%,var(--surface))}.domain.project{background:var(--background)}.boundary{font-size:12px;letter-spacing:1px;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:10px}.boundary .icon{width:17px;height:17px}.owner-heading{display:flex;align-items:center;gap:12px;margin-bottom:12px}.owner-heading .icon{width:34px;height:34px;color:var(--accent)}.owner-heading h3{font-size:22px}.owner-heading small{display:block;font-size:13px;color:var(--muted);margin-top:2px}.asset-row{display:flex;align-items:center;gap:10px;font-size:15px;line-height:1.6;margin:7px 0}.asset-row .icon{width:21px;height:21px;color:var(--accent)}.project-owners{display:grid;grid-template-columns:1fr 34px 1fr;align-items:start}.owner{padding:12px;border-radius:10px;background:var(--secondaryTint)}.owner.scenario{background:color-mix(in srgb,var(--supported) 9%,var(--surface))}.owner .owner-heading{margin-bottom:8px}.owner .owner-heading .icon{width:30px;height:30px;color:var(--secondary)}.owner.scenario .icon{color:var(--supported)}.owner h3{font-size:20px}.owner p{font-size:14px;color:var(--muted);line-height:1.7}.relation{display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:11px;color:var(--muted);gap:4px}.relation svg{width:30px;height:14px;overflow:visible}.relation.outer{align-self:center;transform:translateY(-18px)}.relation.inner{margin-top:24px}.inputs{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px dashed var(--border);padding-top:10px;margin-top:12px;font-size:13px}.input-item{display:flex;align-items:center;gap:6px}.input-item .icon{width:20px;height:20px;color:var(--accent)}.arch-note{margin-top:13px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}.arch-note b{color:var(--secondary)}
.principles{display:grid;grid-template-columns:repeat(4,1fr);gap:0}.principle{padding:4px 15px;border-right:1px solid var(--border)}.principle:first-child{padding-left:0}.principle:last-child{border:0}.principle .icon{width:26px;height:26px;color:var(--accent);margin-bottom:7px}.principle h3{font-size:17px;margin-bottom:5px}.principle p{font-size:14px;line-height:1.6;color:var(--muted)}
.products{display:flex;align-items:center;justify-content:space-between;gap:16px}.product{display:flex;align-items:center;gap:12px}.product .icon{width:30px;height:30px;color:var(--accent)}.product strong{font-size:17px;display:block;margin-bottom:3px}.product small{font-size:13px;color:var(--muted)}.annotation{font-size:13px;background:color-mix(in srgb,var(--pending) 8%,var(--surface));padding:8px 12px;border-radius:6px;margin-top:13px;color:var(--pending);display:flex;align-items:center;gap:8px}.annotation .icon{height:18px;width:18px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.half{border:1px solid var(--border);border-radius:16px;padding:17px 20px;background:var(--surface);margin-bottom:12px}.half h2{font-size:21px}.facts{display:flex;flex-direction:column;gap:10px}.fact{display:flex;align-items:start;gap:9px;font-size:15px;line-height:1.5}.fact .icon{width:19px;height:19px;margin-top:2px;color:var(--supported)}.pending .fact .icon{color:var(--pending)}.fact small{color:var(--muted);font-size:13px}.fact b{font-weight:750}.pending h2{color:var(--pending)}.takeaway{border-radius:13px;padding:17px 22px;display:flex;gap:15px;align-items:center;background:linear-gradient(110deg,var(--accent),var(--secondary));color:var(--onAccent);font-size:18px;font-weight:650;line-height:1.6}.takeaway .icon{width:34px;height:34px}.fineprint{display:flex;justify-content:space-between;padding:10px 4px 0;font-size:11px;color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(calc(var(--step-count) - 1),1fr 28px) 1fr;align-items:center;gap:0}.step{padding:12px 10px;border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:9px;background:var(--tint)}.step .icon{width:29px;height:29px;color:var(--accent)}.step b{font-size:16px;display:block;line-height:1.4}.step small{display:block;font-size:12px;color:var(--muted);line-height:1.6;margin-top:2px}.forward{font-size:23px;text-align:center;color:var(--accent)}.flow-output{display:flex;justify-content:flex-end;margin-top:10px}.stop{background:color-mix(in srgb,var(--pending) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--pending) 25%,var(--surface));border-radius:8px;padding:9px 13px;font-size:14px;color:var(--pending);display:flex;align-items:center;gap:8px}.stop .icon{width:21px;height:21px}.exchange{width:100%;font-size:14px}.exchange th{text-align:left;padding:9px 12px;background:var(--tint);font-size:13px;color:var(--muted)}.exchange td{padding:9px 12px;border-bottom:1px solid var(--border);line-height:1.5}.exchange tr:last-child td{border:0}.exchange td:first-child{font-weight:700;white-space:nowrap}.stages-note{font-size:13px;color:var(--muted);margin-bottom:14px}.workflow .section{padding:16px 20px}.workflow .mast h1{font-size:38px}.workflow .half h2{font-size:20px}
