<header class="mast" data-region="header"><span class="badge" data-badge="">Repository case / design view</span><div class="eyebrow">DETERMINISTIC ENGINEERING / DE-CASE-01</div><h1 data-heading="">One Library. <em>Clear boundaries.</em></h1><p class="dek">Shared definitions. Independent choices. Traceable project use.</p></header>
<section class="section" data-panel="" data-question="why" data-region="purpose"><h2><span class="num" data-question-marker="">1</span>What does this Library make possible?</h2><div class="lead">
<div class="lead-item"><span class="icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h20v18H5zM9 4h18v18M10 13h10M10 18h7"></path><path d="M5 26h8" stroke-width="3.5"></path><circle cx="24" cy="25" r="4" fill="currentColor" stroke="none"></circle></svg></span><div><h3>Publish once</h3><p>Models, methods and policies<br>Reusable definitions from Library</p></div></div>
<div class="lead-item"><span class="icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h24M4 16h24M4 25h24" opacity=".45"></path><rect x="8" y="3" width="6" height="8" rx="1.5" fill="currentColor"></rect><rect x="19" y="12" width="6" height="8" rx="1.5"></rect><rect x="10" y="21" width="6" height="8" rx="1.5"></rect></svg></span><div><h3>Choose per project</h3><p>Profile selects the needed capabilities<br>Original identities stay intact</p></div></div>
<div class="lead-item"><span class="icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4v7M21 4h7v7M4 21v7h7M28 21v7h-7"></path><rect x="11" y="11" width="10" height="10" rx="2"></rect><path d="M16 4v4M16 24v4M4 16h4M24 16h4" opacity=".5"></path></svg></span><div><h3>Bind actual use</h3><p>Scenario acquires project inputs<br>One use, with source associations</p></div></div></div></section>

<section class="section" data-panel="" data-question="boundaries" data-region="principles"><h2><span class="num" data-question-marker="">3</span>Which responsibilities stay independent?</h2><div class="principles">
