="18">Retry bodies128 x128 KiB =16 MiB</tspan><tspan x="245.5" dy="18">Late slots64 x128 KiB =8 MiB</tspan><tspan x="245.5" dy="18">All remaining timers / metadata / telemetry8 MiB</tspan><tspan x="245.5" dy="18">Total32 only with actual complete accounting</tspan></text></g><g class="ZWZmZWN0 gate"><g class="shape" ><rect x="44" y="671" width="404" height="152" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="246" y="710.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="246" dy="0">RT04 / RT05 independent effect scope</tspan><tspan x="246" dy="17.833333">Resource slot is not operational permission</tspan><tspan x="246" dy="17.833333">Actual original reply binds op1 / a1</tspan><tspan x="246" dy="17.833333">Late-slot bytes do not replace old-task charge</tspan><tspan x="246" dy="17.833333">Only covered retention release frees late slot</tspan><tspan x="246" dy="17.833333">New snapshot cannot rewrite old unknown gold</tspan></text></g><g class="dW5pb24= gate"><g class="shape" ><rect x="8" y="923" width="475" height="135" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="245.5" y="962.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="245.5" dy="0">RT06 compose cleanup and retry</tspan><tspan x="245.5" dy="18">Cleanup16 + retry16 + late8 + remaining8 =48 MiB</tspan><tspan x="245.5" dy="18">Joint modeled plan1904 -32 +48 =1920 MiB</tspan><tspan x="245.5" dy="18">Only if actual common-domain partition established</tspan><tspan x="245.5" dy="18">Unknown overlap stays pending; no double-spent budget</tspan></text></g><g class="cmV1c2U= state"><g class="shape" ><rect x="0" y="1158" width="491" height="135" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="245.5" y="1197.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="245.5" dy="0">RT07 current review