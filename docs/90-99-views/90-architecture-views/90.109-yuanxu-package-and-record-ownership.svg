		.d2-1699991514 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="cm9vdA=="><g class="shape" ><rect x="199" y="12" width="371" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="384.5" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="384.5" dy="0">Root gerbil.pkg</tspan><tspan x="384.5" dy="17.666667">Product + explicit Yuanxu PR dependency</tspan><tspan x="384.5" dy="17.666667">One package identity / ordinary POO language</tspan></text></g><g class="c291cmNlcw=="><g class="shape" ><rect x="203" y="180" width="363" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="384.5" y="218.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="384.5" dy="0">Existing directories inherit package paths</tspan><tspan x="384.5" dy="17.666667">Five redundant gerbil.pkg files removed</tspan><tspan x="384.5" dy="17.666667">Eight interfaces explicitly import Module .def</tspan></text></g><g class="dHlwZXM="><g class="shape" ><rect x="12" y="358" width="338" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="181" y="396.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="181" dy="0">Native define-type + sealed Record</tspan><tspan x="181" dy="17.666667">Reference fields inherited by Asset</tspan><tspan x="181" dy="17.666667">Slot / Class own required fields and shape</tspan></text></g><g class="Y29udGV4dA=="><g class="shape" ><rect x="370" y="358" width="438" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="589" y="396.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="589" dy="0">Existing ObjectContract / YuanxuContract</tspan><tspan x="589" dy="17.666667">Parent, family, Config and evidence associations</tspan><tspan x="589" dy="17.666667">Retain contextual obligations; no parallel object system</tspan></text></g><g class="Y2hlY2tz"><g class="shape" ><rect x="171" y="536" width="427" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="384.5" y="574.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="384.5" dy="0">Actual focused Scheme tests in t/*-test.ss</tspan><tspan x="384.5" dy="17.666667">Missing / mistyped / extra fields must refuse</tspan><tspan x="384.5" dy="17.666667">Native manifests and latest ABI remain separate gates</tspan></text></g><g class="Z2F0ZQ=="><g class="shape" ><rect x="141" y="704" width="487" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="384.5" y="742.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="384.5" dy="0">2 GiB bounded native checks</tspan><tspan x="384.5" dy="17.666667">Current native cohort / recovery detail: view 90.110</tspan><tspan x="384.5" dy="17.666667">No uninstall, manifest fabrication or runtime acceptance claim</tspan></text></g><g class="KHJvb3QgLSZndDsgc291cmNlcylbMF0="><marker id="mk-d2-1699991514-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 385 112 L 385 176