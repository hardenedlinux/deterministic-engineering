		.d2-1614216076 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="aGlzdG9yeQ== design"><g class="shape" ><rect x="696" y="12" width="450" height="114" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="921" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="921" dy="0">DESIGN history input / existing review artifacts</tspan><tspan x="921" dy="17.25">Immutable failures + opposing methods + issue inventory</tspan><tspan x="921" dy="17.25">Scenario MUST resolve trusted predecessor and policy</tspan><tspan x="921" dy="17.25">Require complete bounded inventory; see 90.71</tspan></text></g><g class="cmViYXNl boundary"><g class="shape" ><rect x="371" y="206" width="474" height="114" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="608" y="244.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="608" dy="0">EXISTING nasa-lifecycle-rebase</tspan><tspan x="608" dy="17.25">Same subject/scope + different revision -&gt; unstarted</tspan><tspan x="608" dy="17.25">No native action-resolution or history-completeness proof</tspan><tspan x="608" dy="17.25">Old failures excluded from current RF are still historical facts</tspan></text></g><g class="YTA1 design"><g class="shape" ><rect x="12" y="400" width="394" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="209" y="438.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="209" dy="0">A05-6 / B -&gt; B2</tspan><tspan x="209" dy="17">Same Rust bytes and pure checker result</tspan><tspan x="209" dy="17">Real r2 review + independence and action closure</tspan><tspan x="209" dy="17">New participant/completion evidence</tspan><tspan x="209" dy="17">Two displays never substitute for two reviewers</tspan></text></g><g class="YTA2 design"><g class="shape" ><rect x="426" y="400" width="364" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="608" y="438.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="608" dy="0">A06-6 / S1 source retained</tspan><tspan x="608" dy="17">Pending branch -&gt; completed review C-ready</tspan><tspan x="608" dy="17">Recorded C fail branch -&gt; review D</tspan><tspan x="608" dy="17">Actual S1 result + independent oracle</tspan><tspan x="608" dy="17">S0 receipt never becomes S1 evidence</tspan></text></g><g class="YTA4 design"><g class="shape" ><rect x="810" y="400" width="384" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="1002" y="438.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1002" dy="0">A08-8 / B -&gt; C -&gt; conditional C2</tspan><tspan x="1002" dy="17">Correct callback / cost / proof-status prose</tspan><tspan x="1002" dy="17">Keep required engineering goals and open work</tspan><tspan x="1002" dy="17">C still blocked if required proof is missing</tspan><tspan x="1002" dy="17">C2 needs real resolution, not another pass label</tspan></text></g><g class="YnVuZGxl design"><g class="shape" ><rect x="535" y="660" width="540" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="805" y="698.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="805" dy="0">DESIGN disposition bundle using existing review artifacts</tspan><tspan x="805" dy="17">Every inherited issue -&gt; action -&gt; actual result -&gt; independent decision</tspan><tspan x="805" dy="17">Eight paragraph locators / source and review manifests / reuse map</tspan><tspan x="805" dy="17">Stable T/V content reused; new A and exact criterion bindings</tspan><tspan x="805" dy="17">No new packet runtime, Catalog or framework</tspan></text></g><g class="dmVyaWZ5 owner"><g class="shape" ><rect x="542" y="860" width="526" height="146" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="805" y="898.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="805" dy="0">EXISTING verification adapter boundary</tspan><tspan x="805" dy="16.833333">REQUIRED: inspect content and expected policy/history</tspan><tspan x="805" dy="16.833333">Expanded counters reopen affected review; see 90.71</tspan><tspan x="805" dy="16.833333">Missing closure -&gt; no completion receipt</tspan><tspan x="805" dy="16.833333">Current registered fail -&gt; requirements-blocked</tspan><tspan x="805" dy="16.833333">Native context snapshot alone does not seal manifest/history/policy</tspan></text></g><g class="cmVzdWx0 owner"><g class="shape" ><rect x="540" y="1076" width="529" height="130" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="804.5" y="1114.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="804.5" dy="0">EXISTING stage gate at explicit now</tspan><tspan x="804.5" dy="17">Fresh context + eight matching current content receipts</tspan><tspan x="804.5" dy="17">Verified content must cover action closure; no current fail</tspan><tspan x="804.5" dy="17">Only then focused stage admission</tspan><tspan x="804.5" dy="17">Retain old blocked cuts; later arrivals require new intake/use review</tspan></text></g><g class="bGltaXQ= boundary"><g class="shape" ><rect x="529" y="1276" width="551" height="114" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="804.5" y="1314.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="804.5" dy="0">QUALIFICATION BOUNDARY</tspan><tspan x="804.5" dy="17.25">New trajectories are authored gold only</tspan><tspan x="804.5" dy="17.25">History lookup, identity uniqueness and live-use invalidation need tests</tspan><tspan x="804.5" dy="17.25">No new implementation, proof or production admission</tspan></text></g><g class="KGhpc3RvcnkgLSZndDsgcmViYXNlKVswXQ=="><marker id="mk-d2-1614216076-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 846 128 L 846 156 S 846 166 836 166 L 618 166 S 608 166 608 176 L 608 202" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1614216076-3488378134)" mask="url(#d2-1614216076)" /></g><g class="KHJlYmFzZSAtJmd0OyBhMDUpWzBd"><path d="M 489.5 322 L 489.5 350 S 489.5 360 479.5 360 L 219 360 S 209 360 209 370 L 209 396" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1614216076-3488378134)" mask="url(#d2-1614216076)" /></g><g class="KHJlYmFzZSAtJmd0OyBhMDYpWzBd"><path d="M 608 322 L 608 396" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1614216076-3488378134)" mask="url(#d2-1614216076)" /></g><g class="KHJlYmFzZSAtJmd0OyBhMDgpWzBd"><path d="M 726.5 322 L 726.5 350 S 726.5 360 736.5 360 L 992 360 S 1002 360 1002 370 L 1002 396" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1614216076-3488378134)" mask="url(#d2-1614216076)" /></g><g class="KGEwNSAtJmd0OyBidW5kbGUpWzBd"><path d="M 209 532 L 209 610 S 209 620 219 620 L 633 620 S 643 620 643 630 L 643 656" stroke="#0D32B2" fill="none" class=