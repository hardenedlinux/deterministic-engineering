		.d2-3389034924 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="cmF3 input"><g class="shape" ><rect x="48" y="0" width="362" height="118" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="229" y="39.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="229" dy="0">BL00 full counter and required intake</tspan><tspan x="229" dy="18.25">OH-counter / 17 items / P0 family13</tspan><tspan x="229" dy="18.25">TCounter binds bytes, not method validity</tspan><tspan x="229" dy="18.25">Raw conflict and history retained</tspan></text></g><g class="bWV0aG9k gate"><g class="shape" ><rect x="178" y="218" width="354" height="118" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="355" y="257.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="355" dy="0">BL01 / BL02 authentic completed method</tspan><tspan x="355" dy="18.25">Valid counter != positive Q satisfaction</tspan><tspan x="355" dy="18.25">Invalid artifact != incomplete checker</tspan><tspan x="355" dy="18.25">Wrong offered subject / issuer: RJ06</tspan></text></g><g class="cmV2aWV3 gate"><g class="shape" ><rect x="156" y="436" width="399" height="118" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="355.5" y="475.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="355.5" dy="0">BL03 authorized exact disposition</tspan><tspan x="355.5" dy="18.25">Counter / target / intake / reason / policy</tspan><tspan x="355.5" dy="18.25">Earlier method -&gt; review cut -&gt; disposition</tspan><tspan x="355.5" dy="18.25">Then fresh current-use cut; no own-result cycle</tspan></text></g><g class="Y2xvc2Vk state"><g class="shape" ><rect x="143" y="675" width="425" height="118" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="355.5" y="714.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="355.5" dy="0">BL04 / BL05 item-scoped closure</tspan><tspan x="355.5" dy="18.25">Rejected-invalid may close this review item</tspan><tspan x="355.5" dy="18.25">Psrc inapplicability closes only justified Psrc scope</tspan><tspan x="355.5" dy="18.25">Accepted-valid keeps applicable P0 defeat</tspan></text></g><g class="cmVtYWluaW5n gate"><g class="shape" ><rect x="158" y="893" width="395" height="135" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="355.5" y="932.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="355.5" dy="0">BL05 independent remaining guards</tspan><tspan x="355.5" dy="18">Full intake and opposing coverage</tspan><tspan x="355.5" dy="18">All positive slots / argument / current use</tspan><tspan x="355.5" dy="18">A and operational authority still unestablished</tspan><tspan x="355.5" dy="18">No automatic Eligible or all-clear</tspan></text></g><g class="Y2hhbmdl input"><g class="shape" ><rect x="5" y="1128" width="447" height="135" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="228.5" y="1167.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="228.5" dy="0">BL06 dependency-scoped reuse</tspan><tspan x="228.5" dy="18">New member rechecks aggregate coverage</tspan><tspan x="228.5" dy="18">Old exact item/body history may remain reusable</tspan><tspan x="228.5" dy="18">Stale use RJ10; unknown current scope pending</tspan><tspan x="228.5" dy="18">Conflicting dispositions require authorized resolution</tspan></text></g><g class="cGF0aHM= input"><g class="shape" ><rect x="18" y="1363" width="421" height="135" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="228.5" y="1402.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="228.5" dy="0">Three independent paths</tspan><tspan x="228.5" dy="18">C-CAP: P0 resolution not Pcap validity</tspan><tspan x="228.5" dy="18">C-CACHE: cache access / counters remain separate</tspan><tspan x="228.5" dy="18">C-SOURCE: Psrc relevance cannot erase P0 review</tspan><tspan x="228.5" dy="18">No new scored variant or runtime qualification</tspan></text></g><g class="KHJhdyAtJmd0OyBtZXRob2QpWzBd"><marker id="mk-d2-3389034924-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 298.51482 119.305879 C 343.399994 158 355 178 355 214" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3389034924-3488378134)" mask="url(#d2-3389034924)" /></g><g class="KG1ldGhvZCAtJmd0OyByZXZpZXcpWzBd"><path d="M 355 338 C 355 376 355 396 355 432" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3389034924-3488378134)" mask="url(#d2-3389034924)" /></g><g class="KHJldmlldyAtJmd0OyBjbG9zZWQpWzBd"><path d="M 355 555.5 C 355 602.299988 355 626.700012 355 671.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3389034924-3488378134)" mask="url(#d2-3389034924)" /></g><g class="KGNsb3NlZCAtJmd0OyByZW1haW5pbmcpWzBd"><path d="M 355 795 C 355 833 355 853 355 889" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3389034924-3488378134)" mask