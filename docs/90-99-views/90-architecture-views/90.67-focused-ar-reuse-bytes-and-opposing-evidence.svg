		.d2-573653548 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="c3RhdHVz design"><g class="shape" ><rect x="478" y="12" width="581" height="82" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="768.5" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="768.5" dy="0">COMPLETE DESIGN INPUTS / PROSPECTIVE GOLD</tspan><tspan x="768.5" dy="18.5">No new code, admission adapter, evidence issuance or standard assessment</tspan></text></g><g class="aW5wdXRz context"><g class="shape" ><rect x="491" y="164" width="556" height="98" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="769" y="202.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="769" dy="0">Captured inputs before validation</tspan><tspan x="769" dy="17.666667">Exact contract / policy / oracle / schema and transitive closure</tspan><tspan x="769" dy="17.666667">Cut excludes method outputs, reviews and A; local names are not hashes</tspan></text></g><g class="YXIwNQ== design"><g class="shape" ><rect x="12" y="342" width="474" height="114" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="249" y="380.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="249" dy="0">AR05: identical frozen review views</tspan><tspan x="249" dy="17.25">Two explicit holder rows + pure predicate + one-result policy</tspan><tspan x="249" dy="17.25">One V may serve two independently bound uses</tspan><tspan x="249" dy="17.25">Retain role multiplicity and final live-use rechecks</tspan></text></g><g class="YXIwNg== design"><g class="shape" ><rect x="506" y="342" width="526" height="114" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="769" y="380.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="769" dy="0">AR06: exact one-comment transform</tspan><tspan x="769" dy="17.25">Meaning review and source-byte applicability are separate</tspan><tspan x="769" dy="17.25">Old issuer refuses changed input or old capture mismatches new cut</tspan><tspan x="769" dy="17.25">Unchanged model/proof knowledge does not restore native support</tspan></text></g><g class="YXIwOA== design"><g class="shape" ><rect x="1052" y="342" width="544" height="114" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="1324" y="380.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1324" dy="0">AR08: three separately scoped claims</tspan><tspan x="1324" dy="17.25">All callbacks outside lock / O(1) shutdown / complete checked proof</tspan><tspan x="1324" dy="17.25">Clone context, cost domain and missing proof reviewed independently</tspan><tspan x="1324" dy="17.25">Wake-only sample cannot satisfy a clone-inclusive claim</tspan></text></g><g class="b3JhY2xl design"><g class="shape" ><rect x="541" y="536" width="455" height="114" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="768.5" y="574.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="768.5" dy="0">Independent oracle and method review</tspan><tspan x="768.5" dy="17.25">Exact inputs / effects / coverage / source context</tspan><tspan x="768.5" dy="17.25">No author-comment oracle; no invented proof failure</tspan><tspan x="768.5" dy="17.25">Admission remains conditional on actual validated results</tspan></text></g><g class="cmVsYXRpb25z existing"><g class="shape" ><rect x="563" y="720" width="411" height="130" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="768.5" y="758.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="768.5" dy="0">EXISTING ASCENT algebra: AR08 diagnostic gold</tspan><tspan x="768.5" dy="17">No result: support=0 / counter=0 / pending=3</tspan><tspan x="768.5" dy="17">Checked callback fail only: 0 / 1 / 3</tspan><tspan x="768.5" dy="17">If matching bad pass is also checked: 1 / 1 / 2</tspan><tspan x="768.5" dy="17">Absent pending does not resolve opposing evidence</tspan></text></g><g class="c3RhbmRhcmQ= existing"><g class="shape" ><rect x="526" y="920" width="485" height="114" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="768.5" y="958.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="768.5" dy="0">EXISTING Aitia standard review owner</tspan><tspan x="768.5" dy="17.25">Proper criterion / subject / revision / scope / source binding</tspan><tspan x="768.5" dy="17.25">If applicable, current failure precedes evidence-present</tspan><tspan x="768.5" dy="17.25">Unknown applicability stays unknown; no assessment was run</tspan></text></g><g class="Y2xvc3VyZQ== context"><g class="shape" ><rect x="498" y="1104" width="542" height="114" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="769" y="1142.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="769" dy="0">History and effort boundaries</tspan><tspan x="769" dy="17.25">Saved queries keep their captured cut; late old results stay scoped</tspan><tspan x="769" dy="17.25">Reuse unaffected evidence; retain necessary race / role / action checks</tspan><tspan x="769" dy="17.25">Avoid duplicate pure runs, unrelated proof reruns and copied Catalogs</tspan></text></g><g class="KHN0YXR1cyAtJmd0OyBpbnB1dHMpWzBd"><marker id="mk-d2-573653548-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 769 96 L 769 160" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-573653548-3488378134)" mask="url(#d2-573653548)" /></g><g class="KGlucHV0cyAtJmd0OyBhcjA1KVswXQ=="><path d="M 630 264 L 630 292 S 630 302 620 302 L 259 302 S 249 302 249 312 L 249 338" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-573653548-3488378134)" mask="url(#d2-573653548)" /></g><g class="KGlucHV0cyAtJmd0OyBhcjA2KVswXQ=="><path d="M 769 264 L 769 338" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-573653548-3488378134)" mask="url(#d2-573653548)" /></g><g class="KGlucHV0cyAtJmd0OyBhcjA4KVswXQ=="><path d="M 908 264 L 908 292 S 908 302 918 302 L 1314 302 S 1324 302 1324 312 L 1324 338" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-573653548-3488378134)" mask="url(#d2-573653548)" /></g><g class="KGFyMDUgLSZndDsgb3JhY2xlKVswXQ=="><path d="M 249 458 L 249 486 S 249 496 259 496 L 645.25 496 S 655.25 496 655.25 506 L 655.25 532" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-573653548-3488378134)" mask="url(#d2-573653548)" /></g><g class="KGFyMDYgLSZndDsgb3JhY2xlKVswXQ=="><path d="M 769 458 L 769 532" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-573653548-3488378134)" mask="url(#d2-573653548)" /></g><g class="KGFyMDggLSZndDsgb3JhY2xlKVswXQ=="><path d="M 1324 458 L 1324 486 S 1324 496 1314 496 L 892.75 496 S 882.75 496 882.75 506 L 882.75 532" stroke="#0D32B2" fill="none" class="connection 