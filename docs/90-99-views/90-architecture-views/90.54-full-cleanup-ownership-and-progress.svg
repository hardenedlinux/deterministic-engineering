		.d2-1978042797 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="ZnVsbA== input"><g class="shape" ><rect x="32" y="0" width="412" height="118" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="238" y="39.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="238" dy="0">CF00 full modeled resources</tspan><tspan x="238" dy="18.25">h64 cleanup / a256 active</tspan><tspan x="238" dy="18.25">Exact request / attempt / slot occupant identities</tspan><tspan x="238" dy="18.25">Old r65 active state still retained</tspan></text></g><g class="Y2FuY2Vs gate"><g class="shape" ><rect x="0" y="218" width="475" height="135" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="237.5" y="257.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="237.5" dy="0">CF01 / CF02 cancellation at full cleanup</tspan><tspan x="237.5" dy="18">Captured capacity guard false</tspan><tspan x="237.5" dy="18">No h65 and no premature source-charge release</tspan><tspan x="237.5" dy="18">Keep bounded active ownership until covered disposition</tspan><tspan x="237.5" dy="18">Client timeout not remote no-effect</tspan></text></g><g class="cHJvZ3Jlc3M= gate"><g class="shape" ><rect x="3" y="453" width="470" height="135" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="238" y="492.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="238" dy="0">CF03 progress audit; main worker contract unknown</tspan><tspan x="238" dy="18">Full state alone need not invalidate covered model proof</tspan><tspan x="238" dy="18">Cycle fork: active waits cleanup / cleanup waits active</tspan><tspan x="238" dy="18">If no transition enabled: modeled resource deadlock</tspan><tspan x="238" dy="18">Fairness cannot remove that cycle</tspan></text></g><g class="ZnJlZQ== input"><g class="shape" ><rect x="9" y="709" width="457" height="118" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="237.5" y="748.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="237.5" dy="0">CF04 exact occupant c1 actually released</tspan><tspan x="237.5" dy="18.25">h64 -&gt;63 for covered c1 only</tspan><tspan x="237.5" dy="18.25">Old callback cannot release later occupant r65</tspan><tspan x="237.5" dy="18.25">Late records keep original attempt and snapshot scope</tspan></text></g><g class="dHJhbnNmZXI= gate"><g class="shape" ><rect x="7" y="927" width="461" height="135" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="237.5" y="966.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="237.5" dy="0">CF05 / CF06 current covered handoff</tspan><tspan x="237.5" dy="18">Recheck/reserve actual availability at transfer</tspan><tspan x="237.5" dy="18">h63 -&gt;64; a256 -&gt;255 without accounting gap</tspan><tspan x="237.5" dy="18">Stale free-slot observation insufficient</tspan><tspan x="237.5" dy="18">New overflow path rechecks model/source applications</tspan></text></g><g class="cmV1c2U= state"><g class="shape" ><rect x="6" y="1162" width="463" height="135" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="237.5" y="1201.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="237.5" dy="0">CF07 separate retained claims</tspan><tspan x="237.5" dy="18">Existing full-state model may reuse under real guards</tspan><tspan x="237.5" dy="18">Actual retention release not operational retry authority</tspan><tspan x="237.5" dy="18">Old proof/trace history retained</tspan><tspan x="237.5" dy="18">Current ownership / progress / effect kept distinct</tspan></text></g><g class="KGZ1bGwgLSZndDsgY2FuY2VsKVswXQ=="><marker id="mk-d2-1978042797-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 237.5 120 C 237.5 158 237.5 178 237.5 214" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1978042797-3488378134)" mask="url(#d2-1978042797)" /></g><g class="KGNhbmNlbCAtJmd0OyBwcm9ncmVzcylbMF0="><path d="M 237.5 355 C 237.5 393 237.5 413 237.5 449" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1978042797-3488378134)" mask="url(#d2-1978042797)" /></g><g class="KHByb2dyZXNzIC0mZ3Q7IGZyZWUpWzBd"><path d="M 237.5 589.5 C 237.5 636.299988 237.5 660.700012 237.5 705.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1978042797-3488378134)" mask="url(#d2-1978042797)" /><text x="238" y="654" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">separate actual release companion</text></g><g class="KGZyZWUgLSZndDsgdHJhbnNmZXIpWzBd"><path d="M 237.5 829 C 237.5 867 237.5 887 237.5 923" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1978042797-3488378134)" mask="url(#d2-1978042797)" /></g><g class="KHRyYW5zZmVyIC0mZ3Q7IHJldXNlKVswXQ=="><path d="M 237.5 1064 C 237.5 1102 237.5 1122 237.5 1158" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1978042797-3488378134)" mask="url(#d2-19