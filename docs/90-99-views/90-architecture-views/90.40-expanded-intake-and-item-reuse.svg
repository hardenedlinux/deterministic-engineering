"364" dy="18.25">Whole-intake or no-other-counter reason: reassess</tspan><tspan x="364" dy="18.25">Unknown reuse scope: pending, not automatic carry</tspan></text></g><g class="Y2Fycnk= state"><g class="shape" ><rect x="372" y="654" width="380" height="118" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="562" y="693.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="562" dy="0">Actual policy allows counter-local carry</tspan><tspan x="562" dy="18.25">All reason dependencies unchanged</tspan><tspan x="562" dy="18.25">Fresh current use can retain old item closure</tspan><tspan x="562" dy="18.25">Original DOld and intake are not rewritten</tspan></text></g><g class="cmVjaGVjaw== gate"><g class="shape" ><rect x="165" y="872" width="398" height="135" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="364" y="911.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="364" dy="0">MR04 / MR05 new item</tspan><tspan x="364" dy="18">Old reason never substitutes for VNew / DNew</tspan><tspan x="364" dy="18">Invalid + authorized review may close this item</tspan><tspan x="364" dy="18">Valid accepted counter remains a defeat</tspan><tspan x="364" dy="18">Incomplete checker remains pending</tspan></text></g><g class="YWdncmVnYXRl gate"><g class="shape" ><rect x="131" y="1107" width="467" height="118" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="364.5" y="1146.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="364.5" dy="0">MR06 expanded full-domain review</tspan><tspan x="364.5" dy="18.25">Recheck membership / negative coverage / item uses</tspan><tspan x="364.5" dy="18.25">Old complete coverage stays true for old domain only</tspan><tspan x="364.5" dy="18.25">Positive slots / argument / A / current authority separate</tspan></text></g><g class="cGF0aHM= inpu