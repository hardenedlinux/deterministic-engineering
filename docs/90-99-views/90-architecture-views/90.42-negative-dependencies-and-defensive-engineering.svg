carry fails changed reason guard</tspan><tspan x="222.5" dy="18">Reassess review / aggregate / negative coverage</tspan><tspan x="222.5" dy="18">Keep history; check independent method guards</tspan><tspan x="222.5" dy="18">New item needs its own method and review</tspan></text></g><g class="cmV2aWV3 gate"><g class="shape" ><rect x="0" y="671" width="444" height="135" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="222" y="710.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="222" dy="0">ND04 / ND05 / ND06 actual reassessment</tspan><tspan x="222" dy="18">New authorized supported reason may close old item</tspan><tspan x="222" dy="18">Repeating false absence cannot qualify</tspan><tspan x="222" dy="18">Accepted new counter keeps applicable defeat</tspan><tspan x="222" dy="18">Review closure != positive slots / A / effect authority</tspan></text></g><g class="ZGVmZW5zZQ== state"><g class="shape" ><rect x="19" y="906" width="406" height="152" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="222" y="945.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="222" dy="0">DE01 defensive-engineering case</tspan><tspan x="222" dy="17.833333">Keep established facts; name unresolved guards</tspan><tspan x="222" dy="17.833333">Block affected use, not all Agent discovery</tspan><tspan x="222" dy="17.833333">Do not convert unknown into violation</tspan><tspan x="222" dy="17.833333">Do not purge independent reusable evidence</tspan><tspan x="222" dy="17.833333">Extra checks need a named obligation / owner</tspan></text></g><g class="cGF0aHM= input"><g class="shape" ><rect x="10" y="1158" width="425" height="135" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="222.5" y="1197.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:17px"><tspan x="222.5" dy="0">Resolve through existing evidence paths</tspan><tspan x="222.5" dy="18">C-CAP: changed property applicability</tspan><tspan x="222.5" dy="18">C-CACHE: owner / tenant / permission domain</tspan><tspan x="222.5" dy="18">C-SOURCE: source / reason / method dependencies</tspan><tspan x="222.5" dy="18">No new harness, receipt class or runtime claimed</tspan></text></g><g class="KG9sZCAtJmd0OyBuZXcpWzBd"><marker id="mk-d2-3573276959-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 222 120 C 222 158 222 178 222 214" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3573276959-3488378134)" mask="url(#d2-3573276959)" /></g><g class="KG5ldyAtJmd0OyBhZmZlY3RlZClbMF0="><path d="M 222 338 C 222 376 222 396 222 432" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3573276959-3488378134)" mask="url(#d2-3573276959)" /></g><g class="KGFmZmVjdGVkIC0mZ3Q7IHJldmlldylbMF0="><path d="M 222 573 C 222 611 222 631 222 667" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3573276959-3488378134)" mask="url(#d2-3573276959)" /></g><g class="KHJldmlldyAtJmd0OyBkZWZlbnNlKVswXQ=="><path d="M 222 808 C 222 846 222 866 222 902" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3573276959-3488378134)" mask="url(#d2-3573276959)" /></g><g class="KGRlZmVuc2UgLSZndDsgcGF0aHMpWzBd"><path d="M 222 1060 C 222 1098 222 1118 222 1154" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3573276959-3488378134)" mask="url(#d2-3573276959)" /></g><mask id="d2-3573276959" maskUnits="userSpaceOnUse" x="-25" y="-25" width="494" height="1343">
