ords / origins / references</tspan><tspan x="571" dy="17.25">Write, close and rename fresh file</tspan><tspan x="571" dy="17.25">Owner remains live</tspan></text></g><g class="Y2hlY2twb2ludA=="><g class="shape" ><rect x="171" y="568" width="404" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="373" y="606.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="373" dy="0">Signed CHECKPOINT head + selected pin</tspan><tspan x="373" dy="17.666667">Exact prefix digest, inventory count and prior head</tspan><tspan x="373" dy="17.666667">Read back actual closure before confirming</tspan></text></g><g class="YWNr"><g class="shape" ><rect x="12" y="752" width="356" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="190" y="790.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="190" dy="0">submit! returns ID only here</tspan><tspan x="190" dy="17.666667">Caller records acknowledgment after return</tspan><tspan x="190" dy="17.666667">Same signed retry adds no duplicate</tspan></text></g><g class="cmVzdGFydA=="><g class="shape" ><rect x="196" y="930" width="355" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="373.5" y="968.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="373.5" dy="0">New actual process / fresh reader activation</tspan><tspan x="373.5" dy="17.666667">Same archive source and Aitia handover</tspan><tspan x="373.5" dy="17.666667">Fresh native ASCENT queries / Core receipts</tspan></text></g><g class="dmVyZGljdA=="><g class="shape" ><rect x="666" y="1108" width="320" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="826" y="1146.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="826" dy="0">Current native gate</tspan><tspan x="826" dy="17.25">Unresolved counter -&gt; rejected</tspan><tspan x="826" dy="17.25">Current named disposition -&gt; admitted</tspan><tspan x="826" dy="17.25">Incomplete custody -&gt; pending</tspan></text></g><g class="cGFydGlhbA=="><g class="shape" ><rect x="652" y="558" width="347" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="825.5" y="596.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="825.5" dy="0">SIGKILL during partial write</tspan><tspan x="825.5" dy="17.25">No acknowledgment</tspan><tspan x="825.5" dy="17.25">Keep previous complete negative evidence</tspan><tspan x="825.5" dy="17.25">Latest WRITING stays pending; no rollback</tspan></text></g><g class="dW5rbm93bg=="><g class="shape" ><rect x="388" y="752" width="339" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="557.5" y="790.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="557.5" dy="0">SIGKILL after checkpoint / before return</tspan><tspan x="557.5" dy="17.666667">No caller acknowledgment</tspan><tspan x="557.5" dy="17.666667">Recover complete counter conservatively</tspan></text></g><g class="YXV0aG9yaXR5"><g class="shape" ><rect x="867" y="930" width="387" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1060.5" y="968.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1060.5" dy="0">Old receipt / old positive head / old target replay</tspan><tspan x="1060.5" dy="17.666667">Cannot restore current authorization</tspan><tspan x="1060.5" dy="17.666667">Evidence reuse still checks exact applicability</tspan></text></g><g class="KHByb3Bvc2FsIC0mZ3Q7IGludGVudClbMF0="><marker id="mk-d2-712949988-3488378134" mar