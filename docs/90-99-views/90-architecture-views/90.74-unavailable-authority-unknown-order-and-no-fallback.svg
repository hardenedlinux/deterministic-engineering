		.d2-2629363985 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="aW5wdXQ= design"><g class="shape" ><rect x="489" y="12" width="500" height="114" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="739" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="739" dy="0">DESIGN / existing native Aitia review owners</tspan><tspan x="739" dy="17.25">Same Profile, criterion requests and trusted verification adapter</tspan><tspan x="739" dy="17.25">Explicit missing premise and actual governing policy</tspan><tspan x="739" dy="17.25">No new status, history service or fallback authority</tspan></text></g><g class="YXV0aG9yaXR5 design"><g class="shape" ><rect x="12" y="206" width="482" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="253" y="244.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="253" dy="0">AA05 / unavailable archive status</tspan><tspan x="253" dy="17">Authentic historical archive remains evidence</tspan><tspan x="253" dy="17">AH-current still requires applicable status witness</tspan><tspan x="253" dy="17">Timeout is neither denial nor current approval</tspan><tspan x="253" dy="17">Permitted exact status witness can close only its own premise</tspan></text></g><g class="b3JkZXI= design"><g class="shape" ><rect x="514" y="206" width="451" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="739.5" y="244.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="739.5" dy="0">PR07 / unknown revocation-use order</tspan><tspan x="739.5" dy="17">C0 before both R and U; R versus U unresolved</tspan><tspan x="739.5" dy="17">Known effect and current revocation remain facts</tspan><tspan x="739.5" dy="17">Both U-before-R and R-before-U histories remain possible</tspan><tspan x="739.5" dy="17">Current false validity cannot reconstruct past ordering</tspan></text></g><g class="YXBwcm92YWw= design"><g class="shape" ><rect x="985" y="206" width="465" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="1217.5" y="244.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1217.5" dy="0">OH07 / required old-owner approval absent</tspan><tspan x="1217.5" dy="17">Keep original assignment, obligation and actual acceptance</tspan><tspan x="1217.5" dy="17">Willing recipient is not missing approval</tspan><tspan x="1217.5" dy="17">No authorized fallback in the established policy boundary</tspan><tspan x="1217.5" dy="17">Unknown authority inventory also supplies no permission</tspan></text></g><g class="b3JhY2xl design"><g class="shape" ><rect x="510" y="416" width="459" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="739.5" y="454.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="739.5" dy="0">DESIGN / independent missing-premise judgment</tspan><tspan x="739.5" dy="17">Authority/status fact table / compatible causal histories</tspan><tspan x="739.5" dy="17">Actual duty, approver, fallback and acceptance matrix</tspan><tspan x="739.5" dy="17">Preserve partial evidence and seek the exact missing input</tspan><tspan x="739.5" dy="17">A counter needs independently established contrary facts</tspan></text></g><g class="bmF0aXZl owner"><g class="shape" ><rect x="474" y="616" width="531" height="130" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="739.5" y="654.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="739.5" dy="0">EXISTING native content-verification boundary</tspan><tspan x="739.5" dy="17">No successful verification -&gt; no new matching receipt</tspan><tspan x="739.5" dy="17">P8 can be structurally present while content remains unverified</tspan><tspan x="739.5" dy="17">A current registered criterion fail is a separate blocking branch</tspan><tspan x="739.5" dy="17">Old receipts may still admit old inputs; no automatic external lookup</tspan></text></g><g class="cmVzdWx0 boundary"><g class="shape" ><rect x="486" y="816" width="506" height="130" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="739" y="854.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="739" dy="0">DESIGN GOLD / not executed</tspan><tspan x="739" dy="17">Pending is scoped to dependent completion or authority claims</tspan><tspan x="739" dy="17">Valid history, source evidence and proof content remain reusable</tspan><tspan x="739" dy="17">New evidence -&gt; shared recovery contract 10.20 / view 90.75</tspan><tspan x="739" dy="17">Actual outage, order and governance controls still need tests</tspan></text></g><g class="KGlucHV0IC0mZ3Q7IGF1dGhvcml0eSlbMF0="><marker id="mk-d2-2629363985-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 614.5 128 L 614.5 156 S 614.5 166 604.5 166 L 263 166 S 253 166 253 176 L 253 202" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2629363985-3488378134)" mask="url(#d2-2629363985)" /></g><g class="KGlucHV0IC0mZ3Q7IG9yZGVyKVswXQ=="><path d="M 739.5 128 L 739.5 202" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2629363985-3488378134)" mask="url(#d2-2629363985)" /></g><g class="KGlucHV0IC0mZ3Q7IGFwcHJvdmFsKVswXQ=="><path d="M 864.5 128 L 864.5 156 S 864.5 166 874.5 166 L 1207.5 166 S 1217.5 166 1217.5 176 L 1217.5 202" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2629363985-3488378134)" mask="url(#d2-2629363985)" /></g><g class="KGF1dGhvcml0eSAtJmd0OyBvcmFjbGUpWzBd"><path d="M 253 338 L 253 366 S 253 376 263 376 L 614.75 376 S 624.75 376 624.75 386 L 624.75 412" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2629363985-3488378134)" mask="url(#d2-2629363985)" /></g><g class="KG9yZGVyIC0mZ3Q7IG9yYWNsZSlbMF0="><path d="M 739.5 338 L 739.5 412" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2629363985-3488378134)" mask="url(#d2-2629363985)" /></g><g class="KGFwcHJvdmFsIC0mZ3Q7IG9yYWNsZSlbMF0="><path d="M 1217.5 338 L 1217.5 366 S 1217.5 376 1207.5 376 L 864.25 376 S 854.25 376 854.25 386 L 854.25 412" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2629363985-3488378134)" mask="url(#d2-2629363985)" /></g><g class="KG9yYWNsZSAtJmd0OyBuYXRpdmUpWzBd"><path d="M 739.5 548 L 739.5 612" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2629363985-3488378134)" mask="url(#d2-2629363985)" /></g><g class="KG5hdGl2ZSAtJmd0OyByZXN1bHQpWzBd"><path d="M 739.5 748 L 739.5 812" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2629363985-3488378134)" mask="url(#d2-2629363985)" /></g><mask id="d2-2629363985" maskUnits="userSpaceOnUse" x="-13" y="-13" width="1488" height="984">
