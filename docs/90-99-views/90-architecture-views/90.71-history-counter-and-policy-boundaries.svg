		.d2-3784920783 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="aW5wdXQ= design"><g class="shape" ><rect x="427" y="12" width="536" height="114" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="695" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="695" dy="0">DESIGN / bounded existing review artifacts</tspan><tspan x="695" dy="17.25">Work product + predecessor closure + evidence owners + intake cut</tspan><tspan x="695" dy="17.25">Independent expected inventory / original obligations and policy</tspan><tspan x="695" dy="17.25">Same existing Aitia Profile, native requests and focused requirements</tspan></text></g><g class="aGlzdG9yeQ== design"><g class="shape" ><rect x="12" y="206" width="438" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="231" y="244.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="231" dy="0">A05-6.2 / history completeness</tspan><tspan x="231" dy="17">Compare original identities AND captured contents</tspan><tspan x="231" dy="17">Empty, partial or substituted list is insufficient</tspan><tspan x="231" dy="17">Unavailable coverage / exact archive routes: see 90.72</tspan><tspan x="231" dy="17">Track open actions; retain original failures after closure</tspan></text></g><g class="Y291bnRlcg== design"><g class="shape" ><rect x="470" y="206" width="451" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="695.5" y="244.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="695.5" dy="0">A06-6.7 / expanded intake</tspan><tspan x="695.5" dy="17">Raw challenge -&gt; independent relevance / method review</tspan><tspan x="695.5" dy="17">Validated coverage defect reopens completion</tspan><tspan x="695.5" dy="17">Reuse old covered-case results and stable proofs</tspan><tspan x="695.5" dy="17">Recheck affected checklist, actions and review inventory</tspan></text></g><g class="Y2hhbmdl design"><g class="shape" ><rect x="941" y="206" width="437" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="1159.5" y="244.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1159.5" dy="0">A08-8.5 / controlled boundaries</tspan><tspan x="1159.5" dy="17">Revision label does not resolve an issue</tspan><tspan x="1159.5" dy="17">Reduced policy is not full-work approval</tspan><tspan x="1159.5" dy="17">Different scope cannot use native rebase</tspan><tspan x="1159.5" dy="17">Limited work retains original actions/owners: see 90.72</tspan></text></g><g class="YnVuZGxl design"><g class="shape" ><rect x="449" y="416" width="492" height="130" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="695" y="454.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="695" dy="0">DESIGN / existing criterion-content boundary</tspan><tspan x="695" dy="17">Captured inventory difference + action / coverage matrix</tspan><tspan x="695" dy="17">Eight paragraph locators / T-V lineage / new A and requests</tspan><tspan x="695" dy="17">Trusted operation compares expected policy, history and scope</tspan><tspan x="695" dy="17">Missing completion judgment -&gt; no matching p3 receipt</tspan></text></g><g class="bmF0aXZl owner"><g class="shape" ><rect x="492" y="616" width="407" height="130" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="695.5" y="654.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="695.5" dy="0">EXISTING Aitia gate / explicit now</tspan><tspan x="695.5" dy="17">Current submitted fail blocks selected requirement</tspan><tspan x="695.5" dy="17">P8 without content receipts remains unverified</tspan><tspan x="695.5" dy="17">Original historical records keep original revision</tspan><tspan x="695.5" dy="17">No automatic scan of external histories</tspan></text></g><g class="bGltaXRz boundary"><g class="shape" ><rect x="450" y="816" width="490" height="130" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="695" y="854.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="695" dy="0">NATIVE LIMITS / required Scenario discipline</tspan><tspan x="695" dy="17">Old receipts can still admit the old input after external intake</tspan><tspan x="695" dy="17">Gate can admit a supplied reduced policy subset</tspan><tspan x="695" dy="17">Explicit revoke / check / actual-use ordering: see 90.72</tspan><tspan x="695" dy="17">Do not present those results as expanded or full-work approval</tspan></text></g><g class="b3V0cHV0 boundary"><g class="shape" ><rect x="426" y="1016" width="538" height="130" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="695" y="1054.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="695" dy="0">DESIGN GOLD / not executed</tspan><tspan x="695" dy="17">History difference + action status + U / RF + exact gate scope</tspan><tspan x="695" dy="17">Old frozen results preserved; new intake gets a new review</tspan><tspan x="695" dy="17">No new implementation, collector or policy framework</tspan><tspan x="695" dy="17">Concurrency, authority and use-time enforcement remain unqualified</tspan></text></g><g class="KGlucHV0IC0mZ3Q7IGhpc3RvcnkpWzBd"><marker id="mk-d2-