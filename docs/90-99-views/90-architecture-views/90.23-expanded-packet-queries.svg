tions</tspan><tspan x="588.5" dy="17.25">Gold: L0 support + exact target unknowns</tspan><tspan x="588.5" dy="17.25">C-CAP / C-CACHE / C-SOURCE</tspan></text></g><g class="QlEwNA== binding"><g class="shape" ><rect x="395" y="136" width="387" height="114" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="588.5" y="174.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="588.5" dy="0">BQ04: Usage / T-use / method slots</tspan><tspan x="588.5" dy="17.25">Input: u + tu + V + Arg + relevant cut</tspan><tspan x="588.5" dy="17.25">Gold: scoped pending or checked new-target use</tspan><tspan x="588.5" dy="17.25">C-CAP / C-CACHE / C-SOURCE</tspan></text></g><g class="QlEwNQ== boundary"><g class="shape" ><rect x="804" y="0" width="420" height="114" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="1014" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1014" dy="0">BQ05: Independent comparison</tspan><tspan x="1014" dy="17.25">Input: frozen output + independent input-bound gold</tspan><tspan x="1014" dy="17.25">Gold: no actual verdict from author specification</tspan><tspan x="1014" dy="17.25">C-CAP / C-CACHE / C-SOURCE</tspan></text></g><g class="QlEwNg== binding"><g class="shape" ><rect x="804" y="136" width="420" height="114" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="1014" y="174.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1014" dy="0">BQ06: Impact / retention / reuse</tspan><tspan x="1014" dy="17.25">Input: before / after dependency and record bodies</tspan><tspan x="1014" dy="17.25">Gold: withdraw use; retain original evidence</tspan><tspan x="1014" dy="17.25">C-CAP / C-CACHE / C-SOURCE</tspan></text></g><g class="QlEwNw== boundary"><g class="shape" ><rect x="1246" y="0" width="476" height="114" rx="10" stroke="#9B6C25" fill="#FFF2DD