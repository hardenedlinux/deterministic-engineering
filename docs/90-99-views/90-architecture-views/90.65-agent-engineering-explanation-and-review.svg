		.d2-3143172678 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="c3RhdHVz proposed"><g class="shape" ><rect x="257" y="12" width="608" height="98" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="561" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="561" dy="0">DESIGN ONLY</tspan><tspan x="561" dy="17.666667">No new validator, policy engine or measured review-cost reduction</tspan><tspan x="561" dy="17.666667">Arrows show reasoning/evidence dependencies, not a mandatory tool sequence</tspan></text></g><g class="cXVlc3Rpb24= context"><g class="shape" ><rect x="355" y="188" width="411" height="82" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="560.5" y="226.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="560.5" dy="0">Engineering question / actual project context</tspan><tspan x="560.5" dy="18.5">Optimization, architecture, style or lifecycle change</tspan></text></g><g class="bGlicmFyeQ== proposed"><g class="shape" ><rect x="786" y="180" width="493" height="98" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="1032.5" y="218.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1032.5" dy="0">Selected Library knowledge + project Profile</tspan><tspan x="1032.5" dy="17.666667">Domain contracts / known counters / explanation requirements</tspan><tspan x="1032.5" dy="17.666667">Only relevant obligations; preserve inherited requirements</tspan></text></g><g class="YWdlbnQ= existing"><g class="shape" ><rect x="602" y="358" width="486" height="98" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="845" y="396.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="845" dy="0">LLM-based AI agent</tspan><tspan x="845" dy="17.666667">Discover, hypothesize, compare alternatives and revise design</tspan><tspan x="845" dy="17.666667">Choose checks that resolve outstanding questions</tspan></text></g><g class="cHJvcG9zYWw= proposed"><g class="shape" ><rect x="386" y="536" width="421" height="114" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="596.5" y="574.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="596.5" dy="0">Candidate code and explanation claims</tspan><tspan x="596.5" dy="17.25">Types / ownership / principle / invariant</tspan><tspan x="596.5" dy="17.25">Conditional time and space costs / failures / tradeoffs</tspan><tspan x="596.5" dy="17.25">Author explanation is not checked evidence</tspan></text></g><g class="bWVjaGFuaWNhbA== proposed"><g class="shape" ><rect x="12" y="738" width="331" height="98" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="177.5" y="776.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="177.5" dy="0">Mechanical Style checks</tspan><tspan x="177.5" dy="17.666667">Selected formatter / lint / local policy</tspan><tspan x="177.5" dy="17.666667">Does not validate semantic explanations</tspan></text></g><g class="c2VtYW50aWM= proposed"><g class="shape" ><rect x="363" y="730" width="456" height="114" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="591" y="768.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="591" dy="0">Semantic validation chosen for the claim</tspan><tspan x="591" dy="17.25">Analysis review / QNT / Lean / independent native controls</tspan><tspan x="591" dy="17.25">Separate measurement for speed or latency claims</tspan><tspan x="591" dy="17.25">Actual results and independent gold are required</tspan></text></g><g class="ZXZpZGVuY2U= existing"><g class="shape" ><rect x="244" y="974" width="452" height="114" rx="10" stroke="#19756C" fill="#E6F5F3" style="stroke-width:2;" /></g><text x="470" y="1012.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="470" dy="0">EXISTING ASCENT evidence path</tspan><tspan x="470" dy="17.25">Selected Catalog and dependencies -&gt; obligations</tspan><tspan x="470" dy="17.25">Actual witness + method review + matching current scope</tspan><tspan x="470" dy="17.25">Support / counter / pending and historical references</tspan></text></g><g class="cmV2aWV3 context"><g class="shape" ><rect x="228" y="1158" width="483" height="114" rx="10" stroke="#315B8A" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="469.5" y="1196.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="469.5" dy="0">Focused engineering review / existing SDLC authority</tspan><tspan x="469.5" dy="17.25">Changed contract, assumptions, explanations and evidence</tspan><tspan x="469.5" dy="17.25">Human judgment where no adequate mechanical oracle exists</tspan><tspan x="469.5" dy="17.25">Derived support alone does not authorize merge</tspan></text></g><g class="Y2hhbmdl proposed"><g class="shape" ><rect x="672" y="1352" width="452" height="98" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="898" y="1390.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="898" dy="0">Source / algorithm / dependency / comment-claim change</tspan><tspan x="898" dy="17.666667">Revisit affected explanation and evidence applicability</tspan><tspan x="898" dy="17.666667">Preserve unaffected knowledge and original history</tspan></text></g><g class="ZXZhbHVhdGU= proposed"><g class="shape" ><rect x="145" y="1352" width="488" height="130" rx="10" stroke="#9B6C25" fill="#FFF2DD" style="stroke-width:2;" /></g><text x="389" y="1390.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="389" dy="0">Prospective evaluation: expanded AR01-AR08</tspan><tspan x="389" dy="17">Before/after code + comments / independent review gold</tspan><tspan x="389" dy="17">Missed defects / false alarms / time to assess claims</tspan><tspan x="389" dy="17">Total author + validation + review + maintenance cost</tspan><tspan x="389" dy="17">Comment volume and generation speed are not quality oracles</tspan></text></g><g class="KHN0YXR1cyAtJmd0OyBxdWVzdGlvbilbMF0="><marker id="mk-d2-3143172678-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 561.416016 112 L 561.416016 184" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3143172678-3488378134)" mask="url(#d2-3143172678)" /></g><g class="KHF1ZXN0aW9uIC0mZ3Q7IGFnZW50KVswXQ=="><path d="M 561.416016 272 L 561.416016 308 S 561.416016 318 571.416016 318 L 754.291016 318 S 764.291016 318 764.291016 328 L 764.291016 354" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3143172678-3488378134)" mask="url(#d2-3143172678)" /></g><g class="KGxpYnJhcnkgLSZndDsgYWdlbnQpWzBd"><path d="M 926.291016 280 L 926.291016 354" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3143172678-3488378134)" mask="url(#d2-3143172678)" /></g><g class="KGFnZW50IC0mZ3Q7IHByb3Bvc2FsKVswXQ=="><path d="M 764.291016 458 L 764.291016 532" stroke="#0D32B2" fill="non